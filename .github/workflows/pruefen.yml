name: prüfen

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pruefen-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: foodr
          POSTGRES_PASSWORD: foodr
          POSTGRES_DB: foodr_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U foodr -d foodr_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      FOODR_TEST_DB: postgres://foodr:foodr@localhost:5432/foodr_test?sslmode=disable
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: |
          nicht_formatiert=$(gofmt -l .)
          if [ -n "$nicht_formatiert" ]; then
            echo "gofmt fehlt bei:"; echo "$nicht_formatiert"; exit 1
          fi
      - run: go vet ./...
      - name: go.mod ist aufgeräumt
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
      - name: Tests
        run: go test -race -count=1 ./...
      - name: Abbild baut
        run: docker build -t foodr:pruefung .

  schwachstellen:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: true
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...
