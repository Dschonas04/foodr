name: veröffentlichen

# Ein Tag v* baut die Images für amd64 und arm64, schiebt sie nach ghcr.io
# und legt das Release mit dem passenden Abschnitt aus CHANGELOG.md an.
# Von Hand gestartet entsteht nur der Stand „edge“.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: veroeffentlichen-${{ github.ref }}
  cancel-in-progress: false

jobs:
  images:
    name: ${{ matrix.image.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: foodr
            context: .
            file: Dockerfile
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Besitzer klein schreiben
        env:
          OWNER_RAW: ${{ github.repository_owner }}
        run: echo "OWNER=${OWNER_RAW,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Namen und Tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ env.OWNER }}/${{ matrix.image.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=edge,enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Version
        env:
          REF: ${{ github.ref_name }}
        run: |
          case "$REF" in v*) echo "VERSION=${REF#v}" >> "$GITHUB_ENV" ;; *) echo "VERSION=edge-${GITHUB_SHA::7}" >> "$GITHUB_ENV" ;; esac

      - name: Bauen und hochladen
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ env.VERSION }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=ghcr.io/${{ env.OWNER }}/${{ matrix.image.name }}:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ env.OWNER }}/${{ matrix.image.name }}:buildcache,mode=max

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Release anlegen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          awk -v v="$version" '
            /^## / { if (an) exit; an = ($2 == v || $2 == v ":" || $2 == "[" v "]"); next }
            an
          ' CHANGELOG.md > notizen.md 2>/dev/null || true
          {
            echo
            echo "Images: \`ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/<name>:${version}\` (amd64, arm64), siehe README."
          } >> notizen.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file notizen.md
          else
            gh release create "$TAG" --title "$TAG" --notes-file notizen.md --verify-tag
          fi
