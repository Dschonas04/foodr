# Hält die Seiten auf Docker Hub mit dockerhub/*.md gleich: die Kurzzeile in
# der Liste und die lange Beschreibung auf der Seite des Images. Docker Hub liest
# die README aus dem Repository nicht von selbst.
name: Docker-Hub-Beschreibung

on:
  push:
    branches: [main]
    paths: ['dockerhub/**', '.github/workflows/dockerhub-beschreibung.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  beschreiben:
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    if: ${{ github.repository_owner == 'Dschonas04' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: foodr
            short: "Essensplaner mit Lebensmitteldatenbank (BLS 4.0, Open Food Facts) und Wochenplan per Ollama."
    steps:
      - uses: actions/checkout@v7
      - name: Konto klein schreiben
        run: echo "HUB_USER=${DOCKERHUB_USERNAME,,}" >> "$GITHUB_ENV"
      - uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.HUB_USER }}/${{ matrix.image }}
          short-description: ${{ matrix.short }}
          readme-filepath: dockerhub/${{ matrix.image }}.md
