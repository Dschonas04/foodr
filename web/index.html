<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2e6b4e">
<title>Foodr</title>
<style>
@font-face {
  font-family: "Bricolage"; font-style: normal; font-weight: 400 700; font-display: swap;
  src: url(schrift/bricolage-latin.woff2) format("woff2");
}
:root {
  --grund: #f1f4ef; --flaeche: #ffffff; --flaeche2: #e8ede6; --tinte: #18241d; --leise: #5e6b62;
  --linie: #dce3da; --gruen: #2e6b4e; --gruen-hell: #e2efe7; --warn: #a8432f;
  --eiweiss: #3f6fa8; --fett: #d9a21b; --kh: #8c6bb0; --ballast: #6e9c5a;
  --ns-a: #1e8a4c; --ns-b: #7ab648; --ns-c: #f2c12e; --ns-d: #e8822d; --ns-e: #d6452b;
  --schrift: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  --anzeige: "Bricolage", var(--schrift);
  --r1: 6px; --r2: 12px; --r3: 18px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --grund: #101612; --flaeche: #18201b; --flaeche2: #212b24; --tinte: #e5ece6; --leise: #93a198;
    --linie: #2a352e; --gruen: #6cc093; --gruen-hell: #1f3328; --warn: #e07a62;
    --eiweiss: #7ea6da; --fett: #e8b84a; --kh: #b79ad6; --ballast: #8fbf7a; color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--grund); color: var(--tinte); font: 15px/1.5 var(--schrift); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--gruen); }
:focus-visible { outline: 2px solid var(--gruen); outline-offset: 2px; }
.zahl, td.z, .wertzahl { font-variant-numeric: tabular-nums; }

/* Rahmen: Leiste links, am Telefon unten */
.rahmen { display: grid; grid-template-columns: 236px 1fr; min-height: 100vh; }
.leiste { position: sticky; top: 0; height: 100vh; padding: 26px 18px; display: flex; flex-direction: column;
          gap: 28px; border-right: 1px solid var(--linie); background: var(--grund); }
.marke { font-family: var(--anzeige); font-size: 34px; font-weight: 700; letter-spacing: -.04em;
         line-height: 1; color: var(--tinte); text-decoration: none; padding-left: 10px; }
.marke span { color: var(--gruen); }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav a { display: flex; gap: 12px; align-items: center; padding: 9px 10px; border-radius: var(--r1);
         color: var(--leise); text-decoration: none; font-weight: 500; }
.nav a:hover { color: var(--tinte); background: var(--flaeche2); }
.nav a[aria-current="page"] { color: var(--tinte); background: var(--flaeche); box-shadow: inset 3px 0 0 var(--gruen); }
.nav svg { width: 19px; height: 19px; flex: none; }
.leistenfuss { margin-top: auto; font-size: 12.5px; color: var(--leise); display: grid; gap: 6px; padding-left: 10px; }
.punkt { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--leise); margin-right: 6px; }
.punkt.an { background: var(--gruen); }
main { padding: 34px 40px 80px; max-width: 1120px; width: 100%; }
.kopfleiste { display: none; align-items: center; justify-content: space-between; padding: 14px 16px 0; }
.kopfleiste .marke { font-size: 28px; padding: 0; }
@media (max-width: 860px) {
  .rahmen { grid-template-columns: 1fr; }
  .leiste { position: fixed; z-index: 20; top: auto; bottom: 0; left: 0; right: 0; height: auto; padding: 6px 8px;
            padding-bottom: calc(6px + env(safe-area-inset-bottom)); flex-direction: row; border-right: 0;
            border-top: 1px solid var(--linie); background: var(--flaeche); }
  .leiste .marke, .leistenfuss { display: none; }
  .nav { flex-direction: row; width: 100%; justify-content: space-around; }
  .nav a { flex-direction: column; gap: 2px; font-size: 11px; padding: 6px 4px; flex: 1; }
  .nav a[aria-current="page"] { box-shadow: none; color: var(--gruen); background: transparent; }
  .kopfleiste { display: flex; }
  main { padding: 18px 16px 110px; }
}

/* Seitenkopf */
.seitenkopf { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 22px; }
h1 { font-family: var(--anzeige); font-size: clamp(28px, 4vw, 40px); font-weight: 650; letter-spacing: -.03em; line-height: 1.05; margin: 0; }
h2 { font-family: var(--anzeige); font-size: 20px; font-weight: 600; letter-spacing: -.01em; margin: 0 0 12px; }
h3 { font-size: 15px; font-weight: 600; margin: 0 0 8px; }
.unterzeile { color: var(--leise); margin: 6px 0 0; }
.zurueck { display: inline-flex; gap: 6px; align-items: center; color: var(--leise); text-decoration: none; font-size: 14px; margin-bottom: 10px; }
.zurueck:hover { color: var(--tinte); }
.zurueck svg { width: 16px; height: 16px; flex: none; }

/* Bausteine */
.feld { background: var(--flaeche); border: 1px solid var(--linie); border-radius: var(--r2); padding: 20px; }
.feld + .feld, .abstand { margin-top: 16px; }
.leise { color: var(--leise); }
.klein { font-size: 13px; }
.knopf { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--linie); background: var(--flaeche);
         border-radius: var(--r1); padding: 8px 14px; cursor: pointer; font-weight: 500; text-decoration: none; color: var(--tinte); }
.knopf:hover { border-color: var(--leise); }
.knopf.haupt { background: var(--gruen); border-color: var(--gruen); color: #fff; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .knopf.haupt { color: #0d1a12; } }
.knopf.haupt:hover { filter: brightness(1.08); }
.knopf.still { border-color: transparent; background: transparent; color: var(--leise); padding: 6px 8px; }
.knopf.still:hover { color: var(--tinte); background: var(--flaeche2); }
.knopf:disabled { opacity: .5; cursor: default; }
.knopf svg { width: 17px; height: 17px; }
.reihe { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.zwischen { display: flex; gap: 12px; align-items: center; justify-content: space-between; }
input, select, textarea { width: 100%; padding: 9px 12px; border: 1px solid var(--linie); border-radius: var(--r1); background: var(--flaeche); }
input:focus, select:focus, textarea:focus { border-color: var(--gruen); outline: none; box-shadow: 0 0 0 3px var(--gruen-hell); }
label.ueber { display: block; font-size: 13px; color: var(--leise); margin: 14px 0 5px; }
.raster2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.raster3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
@media (max-width: 640px) {
  .raster2, .raster3 { grid-template-columns: 1fr; }
  .wahl { display: grid; grid-template-columns: 1fr 1fr; width: 100%; }
  .wahl button + button { border-left: 0; }
  .wahl button:nth-child(even) { border-left: 1px solid var(--linie); }
  .wahl button:nth-child(n+3) { border-top: 1px solid var(--linie); }
  .filter select { width: 100%; }
}
.chip { display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; padding: 2px 9px; border-radius: 999px;
        background: var(--flaeche2); color: var(--leise); white-space: nowrap; }
.chip.gruen { background: var(--gruen-hell); color: var(--gruen); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.wahl { display: inline-flex; border: 1px solid var(--linie); border-radius: var(--r1); overflow: hidden; background: var(--flaeche); flex-wrap: wrap; }
.wahl button { border: 0; background: transparent; padding: 7px 13px; cursor: pointer; color: var(--leise); }
.wahl button + button { border-left: 1px solid var(--linie); }
.wahl button[aria-pressed="true"] { background: var(--gruen-hell); color: var(--gruen); font-weight: 600; }
.haken { display: inline-flex; gap: 7px; align-items: center; cursor: pointer; user-select: none; }
.haken input { width: 16px; height: 16px; accent-color: var(--gruen); margin: 0; flex: none; }
.tagwahl { display: flex; gap: 6px; flex-wrap: wrap; }
.tagwahl label { cursor: pointer; position: relative; }
.tagwahl input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.tagwahl span { display: inline-block; min-width: 42px; text-align: center; padding: 6px 10px; border-radius: var(--r1);
                border: 1px solid var(--linie); color: var(--leise); }
.tagwahl input:checked + span { background: var(--gruen-hell); border-color: var(--gruen); color: var(--gruen); font-weight: 600; }
.tagwahl input:focus-visible + span { outline: 2px solid var(--gruen); outline-offset: 2px; }
.meldung { color: var(--warn); font-size: 14px; }
.hinweis { color: var(--leise); font-size: 14px; }
.leer { padding: 40px 20px; text-align: center; color: var(--leise); }
.leer h2 { color: var(--tinte); }
table { width: 100%; border-collapse: collapse; }
td, th { text-align: left; padding: 9px 8px; border-bottom: 1px solid var(--linie); vertical-align: top; }
th { font-size: 12.5px; color: var(--leise); font-weight: 500; }
td.z, th.z { text-align: right; white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
.tabelle { overflow-x: auto; }

/* Energiestreifen: woher die Energie kommt */
.streifen { display: flex; height: 6px; border-radius: 3px; overflow: hidden; background: var(--flaeche2); min-width: 60px; }
.streifen i { display: block; height: 100%; }
.streifen .e { background: var(--eiweiss); } .streifen .f { background: var(--fett); }
.streifen .k { background: var(--kh); } .streifen .b { background: var(--ballast); }
.streifen.dick { height: 12px; border-radius: 6px; }
.legende { display: flex; gap: 4px 12px; flex-wrap: wrap; font-size: 12.5px; color: var(--leise); margin-top: 8px; }
.legende i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.kcal { font-family: var(--anzeige); font-weight: 650; letter-spacing: -.02em; font-variant-numeric: tabular-nums; white-space: nowrap; }
.kcal small { font-family: var(--schrift); font-weight: 400; font-size: 12px; color: var(--leise); margin-left: 3px; letter-spacing: 0; }
.grosskcal { font-size: 44px; line-height: 1; }
.werteliste { display: grid; grid-template-columns: 1fr auto; margin-top: 14px; }
.werteliste div { padding: 7px 0; border-bottom: 1px solid var(--linie); }
.werteliste .unter { padding-left: 14px; color: var(--leise); }
.werteliste .z { text-align: right; }
.nutri { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 5px; font-weight: 700;
         font-size: 12.5px; color: #fff; flex: none; }
.nutri.A { background: var(--ns-a); } .nutri.B { background: var(--ns-b); } .nutri.C { background: var(--ns-c); color: #3a2e00; }
.nutri.D { background: var(--ns-d); } .nutri.E { background: var(--ns-e); }

/* Woche */
.wochenkopf { display: flex; align-items: center; gap: 8px; }
.tage { background: var(--flaeche); border: 1px solid var(--linie); border-radius: var(--r2); overflow: hidden; }
.tag { display: grid; grid-template-columns: 82px 1fr auto; gap: 18px; padding: 16px 20px; border-top: 1px solid var(--linie); align-items: center; }
.tag:first-child { border-top: 0; }
.tag.heute { box-shadow: inset 3px 0 0 var(--gruen); }
.datum b { display: block; font-family: var(--anzeige); font-size: 24px; font-weight: 650; letter-spacing: -.02em; line-height: 1; }
.datum span { font-size: 12.5px; color: var(--leise); }
.gericht { min-width: 0; }
.gericht a { color: var(--tinte); text-decoration: none; font-weight: 600; font-size: 16px; }
.gericht a:hover { color: var(--gruen); }
.gericht .meta { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 5px; align-items: center; }
.gericht .streifen { margin-top: 9px; max-width: 320px; }
.gekocht .gericht a { text-decoration: line-through; color: var(--leise); }
.tagknoepfe { display: flex; gap: 2px; }
@media (max-width: 640px) {
  .tag { grid-template-columns: 54px 1fr; padding: 14px; gap: 12px; }
  .tagknoepfe { grid-column: 2; }
  .datum b { font-size: 20px; }
}
.planung { margin-bottom: 18px; }
.planung summary { cursor: pointer; color: var(--leise); list-style: none; display: inline-flex; gap: 8px; align-items: center; font-weight: 500; }
.planung summary::-webkit-details-marker { display: none; }
.planung summary svg { width: 16px; height: 16px; }
.schnitt { display: grid; grid-template-columns: auto 1fr; gap: 28px; align-items: center; }
@media (max-width: 640px) { .schnitt { grid-template-columns: 1fr; gap: 12px; } }

/* Einkauf */
.regale { columns: 2 300px; column-gap: 16px; }
.regal { break-inside: avoid; margin: 0 0 16px; }
.feld.regal + .feld.regal { margin-top: 0; }
.posten { display: flex; gap: 6px; align-items: center; padding: 7px 0; border-bottom: 1px solid var(--linie); }
.posten:last-child { border-bottom: 0; }
.posten .was { flex: 1; }
.posten.ab .was span { text-decoration: line-through; color: var(--leise); }
.posten .knopf.still { opacity: 0; }
.posten:hover .knopf.still, .posten .knopf.still:focus-visible { opacity: 1; }
@media (hover: none) { .posten .knopf.still { opacity: 1; } }

/* Rezepte */
.kacheln { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; }
.kachel { display: flex; flex-direction: column; gap: 10px; padding: 18px; background: var(--flaeche);
          border: 1px solid var(--linie); border-radius: var(--r2); color: var(--tinte); text-decoration: none; }
.kachel:hover { border-color: var(--gruen); }
.kachel h3 { font-family: var(--anzeige); font-size: 18px; font-weight: 600; letter-spacing: -.01em; margin: 0; line-height: 1.2; }
.kachel .fuss { margin-top: auto; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.kachel .fuss .streifen { flex: 1; }
.spalten { display: grid; grid-template-columns: minmax(0, 1fr) 330px; gap: 20px; align-items: start; }
.spalten aside { position: sticky; top: 20px; }
@media (max-width: 960px) { .spalten { grid-template-columns: minmax(0, 1fr); } .spalten aside { position: static; } }
@media (max-width: 640px) {
  .zutaten thead { display: none; }
  .zutaten tr { display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto; gap: 2px 10px; padding: 10px 0;
                border-bottom: 1px solid var(--linie); align-items: center; }
  .zutaten tr:last-child { border-bottom: 0; }
  .zutaten td { border: 0; padding: 0; }
  .zutaten td:nth-child(3) { grid-column: 1 / -1; order: 5; font-size: 13.5px; }
  .zutaten td:nth-child(4) { order: 3; } .zutaten td:nth-child(5) { order: 4; }
}
ol.schritte { margin: 0; padding: 0; list-style: none; counter-reset: s; }
ol.schritte li { counter-increment: s; display: grid; grid-template-columns: 30px 1fr; gap: 8px; padding: 10px 0; border-bottom: 1px solid var(--linie); }
ol.schritte li:last-child { border-bottom: 0; }
ol.schritte li::before { content: counter(s); font-family: var(--anzeige); font-weight: 650; color: var(--gruen); font-size: 18px; line-height: 1.3; }
.zuordnung { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.zuordnung a { color: var(--tinte); }
.reiter { display: flex; gap: 4px; border-bottom: 1px solid var(--linie); margin-bottom: 18px; }
.reiter button { border: 0; background: none; padding: 10px 14px; cursor: pointer; color: var(--leise); border-bottom: 2px solid transparent; margin-bottom: -1px; }
.reiter button[aria-selected="true"] { color: var(--tinte); border-bottom-color: var(--gruen); font-weight: 600; }

/* Lebensmittel */
.suchfeld { position: relative; }
.suchfeld input { font-size: 17px; padding: 14px 16px 14px 46px; border-radius: var(--r2); }
.suchfeld svg { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); width: 20px; height: 20px; color: var(--leise); }
.filter { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; margin: 14px 0 18px; }
.filter select { width: auto; max-width: 100%; }
.trefferzahl { color: var(--leise); font-size: 13.5px; margin-bottom: 8px; min-height: 20px; }
.liste { background: var(--flaeche); border: 1px solid var(--linie); border-radius: var(--r2); overflow: hidden; }
.eintrag { display: grid; grid-template-columns: 44px minmax(0, 1fr) 150px 92px; gap: 16px; align-items: center; padding: 11px 16px;
           border-top: 1px solid var(--linie); color: var(--tinte); text-decoration: none; }
.eintrag:first-child { border-top: 0; }
.eintrag:hover { background: var(--grund); }
.eintrag .name { font-weight: 550; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.eintrag .zusatz { font-size: 13px; color: var(--leise); display: flex; gap: 8px; align-items: center; overflow: hidden; white-space: nowrap; }
.eintrag > :last-child { text-align: right; font-size: 17px; }
.bildchen { width: 44px; height: 44px; border-radius: var(--r1); background: var(--flaeche2); display: grid; place-items: center;
            font-family: var(--anzeige); font-weight: 650; color: var(--leise); overflow: hidden; }
.bildchen img { width: 100%; height: 100%; object-fit: cover; }
@media (max-width: 640px) {
  .eintrag { grid-template-columns: 40px minmax(0, 1fr) 70px; gap: 12px; padding: 10px 12px; }
  .eintrag .streifenzelle { display: none; }
  .bildchen { width: 40px; height: 40px; }
}
.produktbild { width: 100%; max-height: 260px; object-fit: contain; border-radius: var(--r2); background: #fff; margin-bottom: 16px; }
.stoffgruppe { border-top: 1px solid var(--linie); }
.stoffgruppe:first-of-type { border-top: 0; }
.stoffgruppe summary { cursor: pointer; padding: 12px 0; font-weight: 600; display: flex; justify-content: space-between; }
.stoffgruppe td { padding: 6px 0; }
.quellangabe { font-size: 12.5px; color: var(--leise); margin-top: 14px; }

/* Mehr */
.bestand { display: grid; grid-template-columns: 1fr auto; gap: 4px 16px; padding: 14px 0; border-top: 1px solid var(--linie); align-items: center; }
.bestand:first-of-type { border-top: 0; padding-top: 0; }
.zahlgross { font-family: var(--anzeige); font-size: 26px; font-weight: 650; text-align: right; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.fortschritt { height: 6px; background: var(--flaeche2); border-radius: 3px; overflow: hidden; margin-top: 10px; }
.fortschritt i { display: block; height: 100%; background: var(--gruen); transition: width .4s; }

dialog { border: 1px solid var(--linie); border-radius: var(--r3); background: var(--flaeche); color: var(--tinte);
         width: min(640px, calc(100vw - 24px)); padding: 22px; }
dialog::backdrop { background: rgba(10, 20, 14, .45); }
.wahlliste { max-height: 50vh; overflow: auto; margin-top: 12px; border: 1px solid var(--linie); border-radius: var(--r1); }
.wahlliste button { display: grid; grid-template-columns: 1fr auto; gap: 12px; width: 100%; text-align: left; border: 0;
                    border-top: 1px solid var(--linie); background: none; padding: 10px 12px; cursor: pointer; }
.wahlliste button:first-child { border-top: 0; }
.wahlliste button:hover { background: var(--grund); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="kopfleiste"><a class="marke" href="#/woche">food<span>r</span></a></div>
<div class="rahmen">
  <aside class="leiste">
    <a class="marke" href="#/woche">food<span>r</span></a>
    <nav class="nav" aria-label="Bereiche">
      <a href="#/woche" data-bereich="woche"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>Woche</a>
      <a href="#/einkauf" data-bereich="einkauf"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h2l2 11h10l2-8H7"/><circle cx="10" cy="19.5" r="1.2"/><circle cx="17" cy="19.5" r="1.2"/></svg>Einkauf</a>
      <a href="#/rezepte" data-bereich="rezepte"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h11M9 8h6"/></svg>Rezepte</a>
      <a href="#/lebensmittel" data-bereich="lebensmittel"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 7c-1.5-2.5-6-2.5-7 1.5-1 4 2 11 5 11 1 0 1.5-.6 2-.6s1 .6 2 .6c3 0 6-7 5-11-1-4-5.5-4-7-1.5z"/><path d="M12 7c0-2 1-3.5 3-4"/></svg>Lebensmittel</a>
      <a href="#/mehr" data-bereich="mehr"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>Mehr</a>
    </nav>
    <div class="leistenfuss"><div id="bestand"></div><div id="modellstand"></div></div>
  </aside>
  <main id="inhalt"></main>
</div>
<dialog id="dialog"></dialog>
<script type="module">
const $ = (s, w = document) => w.querySelector(s);
const $$ = (s, w = document) => [...w.querySelectorAll(s)];
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const zahl = (n, stellen = 1) => n == null || Number.isNaN(Number(n)) ? '–'
  : Number(n).toLocaleString('de-DE', { maximumFractionDigits: stellen });
const grosseZahl = (n) => n >= 1e6 ? zahl(n / 1e6, 1) + ' Mio.' : zahl(n, 0);

const KERN = [
  ['ENERCC', 'Energie', 'kcal', 0], ['PROT625', 'Eiweiß', 'g', 1], ['FAT', 'Fett', 'g', 1],
  ['FASAT', 'davon gesättigte Fettsäuren', 'g', 1, true], ['CHO', 'Kohlenhydrate', 'g', 1],
  ['SUGAR', 'davon Zucker', 'g', 1, true], ['FIBT', 'Ballaststoffe', 'g', 1], ['NACL', 'Salz', 'g', 2],
];
const EINHEITEN = ['g', 'kg', 'ml', 'l', 'EL', 'TL', 'Stück', 'Prise', 'Bund', 'Zehe', 'Dose', 'Packung', 'Scheibe', 'Becher', 'Glas'];
const WOCHENTAGE = ['montag', 'dienstag', 'mittwoch', 'donnerstag', 'freitag', 'samstag', 'sonntag'];
const QUELLEN = { bls: 'Grundlebensmittel', off: 'Markenprodukt', eigen: 'Eigenes' };
const KOST = { vegan: 'vegan', vegetarisch: 'vegetarisch', fisch: 'mit Fisch', fleisch: 'mit Fleisch' };
const AUFWAND = { schnell: 'schnell', mittel: 'mittlerer Aufwand', aufwendig: 'aufwendig' };
const svg = (pfad, w = 1.8) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${pfad}</svg>`;
const ICON = {
  links: svg('<path d="M15 6l-6 6 6 6"/>', 2), rechts: svg('<path d="M9 6l6 6-6 6"/>', 2),
  tausch: svg('<path d="M4 9h13l-3-3M20 15H7l3 3"/>'), stift: svg('<path d="M5 19h4L19 9l-4-4L5 15z"/>'),
  haken: svg('<path d="M5 12.5l4.5 4.5L19 7.5"/>', 2), weg: svg('<path d="M6 6l12 12M18 6L6 18"/>'),
  lupe: svg('<circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/>'), plus: svg('<path d="M12 5v14M5 12h14"/>', 2),
  regler: svg('<path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/>'),
};

async function ruf(weg, art = 'GET', rumpf) {
  const antwort = await fetch(weg, {
    method: art,
    headers: rumpf ? { 'Content-Type': 'application/json' } : undefined,
    body: rumpf ? JSON.stringify(rumpf) : undefined,
  });
  const text = await antwort.text();
  let daten = null;
  try { daten = text ? JSON.parse(text) : null; } catch { daten = { fehler: text }; }
  if (antwort.status === 401) { zeigeAnmeldung(); throw new Error('Anmeldung nötig'); }
  if (!antwort.ok) throw new Error(daten?.fehler || `Antwort ${antwort.status}`);
  return daten;
}

const zustand = { status: null, woche: null, gruppen: null,
  suche: { q: '', quelle: '', gruppe: '', dach: true, ordnen: '' } };
const setze = (html) => { $('#inhalt').innerHTML = html; };

// ---------- Energiestreifen ----------
// Woher die Energie kommt: Eiweiss und Kohlenhydrate 4 kcal/g, Fett 9, Ballaststoffe 2.
function streifen(w, dick = false) {
  const t = [['e', (w?.PROT625 || 0) * 4], ['f', (w?.FAT || 0) * 9], ['k', (w?.CHO || 0) * 4], ['b', (w?.FIBT || 0) * 2]];
  const summe = t.reduce((a, [, v]) => a + v, 0);
  const klasse = `streifen${dick ? ' dick' : ''}`;
  if (!summe) return `<div class="${klasse}"></div>`;
  const pz = (v) => Math.round(v / summe * 100);
  const titel = `Energie aus Eiweiß ${pz(t[0][1])} %, Fett ${pz(t[1][1])} %, Kohlenhydraten ${pz(t[2][1])} %, Ballaststoffen ${pz(t[3][1])} %`;
  return `<div class="${klasse}" role="img" aria-label="${titel}" title="${titel}">${
    t.map(([k, v]) => `<i class="${k}" style="width:${(v / summe * 100).toFixed(1)}%"></i>`).join('')}</div>`;
}
const legende = `<div class="legende"><span><i style="background:var(--eiweiss)"></i>Eiweiß</span>
  <span><i style="background:var(--fett)"></i>Fett</span><span><i style="background:var(--kh)"></i>Kohlenhydrate</span>
  <span><i style="background:var(--ballast)"></i>Ballaststoffe</span></div>`;
const kcal = (w, einheit = 'kcal') => w?.ENERCC == null ? '<span class="kcal leise">–</span>'
  : `<span class="kcal">${zahl(w.ENERCC, 0)}<small>${einheit}</small></span>`;
const werteliste = (w) => `<div class="werteliste">${KERN.map(([c, name, einheit, st, unter]) =>
  `<div class="${unter ? 'unter' : ''}">${name}</div><div class="z wertzahl">${w?.[c] == null ? '–' : zahl(w[c], st) + ' ' + einheit}</div>`).join('')}</div>`;
const nutri = (n) => /^[A-E]$/.test(n || '') ? `<span class="nutri ${n}" title="Nutri-Score ${n}">${n}</span>` : '';

// ---------- Rahmen ----------

async function ladeStatus() {
  zustand.status = await ruf('/api/status');
  zustand.woche ||= zustand.status.woche;
  const s = zustand.status;
  $('#bestand').textContent = `${grosseZahl(s.lebensmittel)} Lebensmittel, ${s.rezepte} Rezepte`;
  $('#modellstand').innerHTML = `<span class="punkt ${s.ollama ? 'an' : ''}"></span>${esc(s.modell)} ${s.ollama ? 'bereit' : 'nicht erreichbar'}`;
}

function zeigeAnmeldung() {
  setze(`<div class="feld" style="max-width:420px;margin:10vh auto 0">
    <h1 style="font-size:32px">Anmelden</h1>
    <p class="unterzeile">Dieses Foodr ist mit einem Kennwort geschützt.</p>
    <label class="ueber" for="kw">Kennwort</label><input id="kw" type="password" autocomplete="current-password">
    <div class="abstand"><button class="knopf haupt" id="anmelden">Anmelden</button></div>
    <p class="meldung" id="kwstand"></p></div>`);
  const los = async () => {
    try { await ruf('/api/anmelden', 'POST', { kennwort: $('#kw').value }); await start(); }
    catch (f) { $('#kwstand').textContent = f.message === 'falsches Kennwort' ? 'Das Kennwort stimmt nicht.' : f.message; }
  };
  $('#anmelden').onclick = los;
  $('#kw').onkeydown = (e) => { if (e.key === 'Enter') los(); };
  $('#kw').focus();
}

const datum = (iso, art) => new Date(iso + 'T12:00:00').toLocaleDateString('de-DE', art);
const schiebe = (iso, tage) => { const d = new Date(iso + 'T12:00:00'); d.setDate(d.getDate() + tage); return d.toISOString().slice(0, 10); };
const heute = () => new Date().toLocaleDateString('sv-SE');

// ---------- Woche ----------

async function zeigeWoche() {
  const [plan, regeln] = await Promise.all([ruf('/api/plan?woche=' + zustand.woche), ruf('/api/regeln')]);
  const p = plan.leer ? null : plan;
  const tage = (regeln.tage || WOCHENTAGE.join(',')).toLowerCase().split(',');
  const kost = (regeln.nur_kost || '').split(',').filter(Boolean);
  const nw = p ? await ruf(`/api/plan/${p.id}/naehrwerte`).catch(() => null) : null;
  const jeTag = Object.fromEntries((nw?.tage || []).map(t => [t.tag, t]));
  setze(`<div class="seitenkopf">
      <div><h1>Woche vom ${datum(zustand.woche, { day: 'numeric', month: 'long' })}</h1>
        <p class="unterzeile">bis ${datum(schiebe(zustand.woche, 6), { weekday: 'long', day: 'numeric', month: 'long' })}</p></div>
      <div class="wochenkopf">
        <button class="knopf" id="vor" aria-label="Woche davor">${ICON.links}</button>
        <button class="knopf" id="jetzt">Diese Woche</button>
        <button class="knopf" id="nach" aria-label="Woche danach">${ICON.rechts}</button>
      </div>
    </div>
    <details class="planung feld" ${p ? '' : 'open'}>
      <summary>${ICON.regler} Planung anpassen</summary>
      <div class="raster2">
        <div><label class="ueber" for="personen">Personen</label>
          <input id="personen" type="number" min="1" max="20" value="${esc(p?.personen ?? regeln.personen ?? 2)}"></div>
        <div><label class="ueber" for="wuensche">Wünsche an den Assistenten</label>
          <input id="wuensche" value="${esc(regeln.wuensche)}" placeholder="Zum Beispiel: wenig Fleisch, Reste vom Sonntag einplanen"></div>
      </div>
      <label class="ueber">An diesen Tagen wird gekocht</label>
      <div class="tagwahl">${WOCHENTAGE.map(t => `<label><input type="checkbox" data-tag="${t}" ${tage.includes(t) ? 'checked' : ''}>
        <span>${t.slice(0, 2).replace(/^./, c => c.toUpperCase())}</span></label>`).join('')}</div>
      <label class="ueber">Nur diese Kost – nichts gewählt heißt alles</label>
      <div class="tagwahl">${Object.entries(KOST).map(([k, n]) => `<label><input type="checkbox" data-kost="${k}" ${kost.includes(k) ? 'checked' : ''}>
        <span>${n}</span></label>`).join('')}</div>
      <div class="reihe abstand"><button class="knopf haupt" id="erzeugen">${p ? 'Plan neu erzeugen' : 'Plan erzeugen'}</button>
        <span class="hinweis" id="stand"></span></div>
    </details>
    ${p ? `${p.begruendung ? `<p class="hinweis" style="max-width:70ch;margin:0 0 16px">${esc(p.begruendung)}</p>` : ''}
      <div class="tage">${p.tage.map(t => tagZeile(t, jeTag[t.tag])).join('')}</div>
      ${nw?.tage?.length ? `<div class="feld abstand schnitt">
        <div><h2 style="margin:0">Im Schnitt je Portion</h2><p class="hinweis" style="margin:4px 0 0">über ${nw.tage.length} Gerichte</p></div>
        <div class="reihe" style="gap:24px"><span class="grosskcal">${kcal(nw.schnitt)}</span>
          <div style="flex:1;min-width:200px">${streifen(nw.schnitt, true)}${legende}</div></div></div>` : ''}`
    : `<div class="feld leer"><h2>Noch kein Plan für diese Woche</h2>
        <p>Leg oben fest, wie geplant wird, und lass den Assistenten einen Vorschlag machen.</p></div>`}`);

  $('#vor').onclick = () => { zustand.woche = schiebe(zustand.woche, -7); zeigeWoche(); };
  $('#nach').onclick = () => { zustand.woche = schiebe(zustand.woche, 7); zeigeWoche(); };
  $('#jetzt').onclick = () => { zustand.woche = zustand.status.woche; zeigeWoche(); };
  $('#erzeugen').onclick = async (e) => {
    e.target.disabled = true;
    $('#stand').textContent = 'Der Assistent wählt die Gerichte aus …';
    try {
      const raus = await ruf('/api/plan/erzeugen', 'POST', {
        woche: zustand.woche, personen: Number($('#personen').value) || 2, wuensche: $('#wuensche').value,
        tage: $$('[data-tag]:checked').map(k => k.dataset.tag), nur_kost: $$('[data-kost]:checked').map(k => k.dataset.kost),
      });
      await zeigeWoche();
      if (raus.meldung) $('#stand').textContent = raus.meldung;
    } catch (f) { $('#stand').textContent = 'Plan konnte nicht erzeugt werden: ' + f.message; e.target.disabled = false; }
  };
  $$('[data-tausch]').forEach(b => b.onclick = async () => {
    b.disabled = true;
    await ruf(`/api/plan/tag/${b.dataset.tausch}/tauschen`, 'POST', { woche: zustand.woche });
    zeigeWoche();
  });
  $$('[data-kochen]').forEach(b => b.onclick = async () => {
    await ruf(`/api/plan/tag/${b.dataset.kochen}/gekocht`, 'POST', { gekocht: b.dataset.an === '1', woche: zustand.woche });
    zeigeWoche();
  });
  $$('[data-waehle]').forEach(b => b.onclick = () => waehleRezept(b.dataset.waehle));
}

function tagZeile(t, w) {
  const r = t.rezept;
  const knopf = (attr, titel, icon, extra = '') =>
    `<button class="knopf still" ${attr} title="${titel}" aria-label="${titel}" ${extra}>${icon}</button>`;
  return `<div class="tag ${t.gekocht ? 'gekocht' : ''} ${t.tag === heute() ? 'heute' : ''}">
    <div class="datum"><b>${datum(t.tag, { weekday: 'short' }).replace('.', '')}</b><span>${datum(t.tag, { day: 'numeric', month: 'short' })}</span></div>
    <div class="gericht">
      ${r ? `<a href="#/rezept/${esc(r.id)}">${esc(r.titel)}</a>` : '<span class="leise">Noch offen</span>'}
      ${r ? `<div class="meta"><span class="chip">${esc(r.dauer_min)} min</span><span class="chip">${esc(KOST[r.kost] || r.kost)}</span>
        ${w ? `<span class="klein">${kcal(w.je_portion, 'kcal je Portion')}</span>` : ''}
        ${t.gekocht ? '<span class="chip gruen">gekocht</span>' : ''}</div>` : ''}
      ${t.hinweis ? `<div class="hinweis">${esc(t.hinweis)}</div>` : ''}
      ${w ? streifen(w.je_portion) : ''}
    </div>
    <div class="tagknoepfe">
      ${knopf(`data-tausch="${esc(t.id)}"`, 'Anderes Gericht vorschlagen', ICON.tausch)}
      ${knopf(`data-waehle="${esc(t.id)}"`, 'Gericht selbst wählen', ICON.stift)}
      ${knopf(`data-kochen="${esc(t.id)}" data-an="${t.gekocht ? 0 : 1}"`, t.gekocht ? 'Doch nicht gekocht' : 'Als gekocht markieren',
        ICON.haken, t.gekocht ? 'style="color:var(--gruen)"' : '')}
    </div></div>`;
}

async function waehleRezept(tagID) {
  const rezepte = await ruf('/api/rezepte');
  const d = $('#dialog');
  d.innerHTML = `<div class="zwischen"><h2 style="margin:0">Gericht wählen</h2>
      <button class="knopf still" id="zu" aria-label="Schließen">${ICON.weg}</button></div>
    <input id="wsuche" type="search" placeholder="Rezept suchen" style="margin-top:14px">
    <div class="wahlliste" id="wliste"></div>`;
  const liste = () => {
    const q = $('#wsuche').value.toLowerCase();
    const t = rezepte.filter(r => r.titel.toLowerCase().includes(q));
    $('#wliste').innerHTML = t.length ? t.map(r => `<button data-id="${esc(r.id)}"><span>${esc(r.titel)}</span>
      <span class="leise klein">${esc(r.dauer_min)} min</span></button>`).join('') : '<p class="leer">Kein Rezept gefunden.</p>';
  };
  liste();
  $('#wsuche').oninput = liste;
  $('#zu').onclick = () => d.close();
  $('#wliste').onclick = async (e) => {
    const b = e.target.closest('button[data-id]');
    if (!b) return;
    await ruf(`/api/plan/tag/${tagID}`, 'PUT', { rezept_id: Number(b.dataset.id), hinweis: '', woche: zustand.woche });
    d.close();
    zeigeWoche();
  };
  d.showModal();
  $('#wsuche').focus();
}

// ---------- Einkauf ----------

async function zeigeEinkauf() {
  const plan = await ruf('/api/plan?woche=' + zustand.woche);
  if (plan.leer) {
    setze(`<div class="seitenkopf"><h1>Einkauf</h1></div>
      <div class="feld leer"><h2>Erst planen, dann einkaufen</h2><p>Die Liste entsteht aus dem Wochenplan.</p>
      <a class="knopf haupt" href="#/woche">Zur Woche</a></div>`);
    return;
  }
  const liste = await ruf(`/api/plan/${plan.id}/einkauf`);
  const offen = liste.filter(p => !p.abgehakt).length;
  const regale = {};
  for (const p of liste) (regale[p.kategorie] ||= []).push(p);
  setze(`<div class="seitenkopf">
      <div><h1>Einkauf</h1><p class="unterzeile">Woche vom ${datum(plan.woche, { day: 'numeric', month: 'long' })}, noch ${offen} von ${liste.length} offen</p></div>
      <a class="knopf" href="/api/plan/${esc(plan.id)}/einkauf.txt" target="_blank" rel="noopener">Als Text öffnen</a>
    </div>
    <div class="feld" style="margin-bottom:16px"><div class="reihe">
      <input id="neuname" placeholder="Etwas ergänzen, zum Beispiel Spülmittel" aria-label="Etwas ergänzen" style="flex:1;min-width:200px">
      <button class="knopf haupt" id="neuposten">${ICON.plus} Hinzufügen</button></div></div>
    <div class="regale">${Object.entries(regale).map(([k, ps]) => `<section class="regal feld">
      <h3>${esc(k)}</h3>${ps.map(p => `<div class="posten ${p.abgehakt ? 'ab' : ''}">
        <label class="haken was"><input type="checkbox" ${p.abgehakt ? 'checked' : ''} data-id="${esc(p.id)}">
          <span>${p.menge ? `<span class="zahl">${zahl(p.menge, 2)} ${esc(p.einheit)}</span> ` : ''}${esc(p.name)}</span></label>
        <button class="knopf still klein" data-vorrat="${esc(p.name)}" title="Steht immer im Haus und kommt künftig nicht mehr auf die Liste">im Vorrat</button>
        <button class="knopf still" data-weg="${esc(p.id)}" aria-label="${esc(p.name)} entfernen">${ICON.weg}</button>
      </div>`).join('')}</section>`).join('')}</div>`);
  $$('.posten input[type=checkbox]').forEach(k => k.onchange = async () => {
    await ruf('/api/einkauf/' + k.dataset.id, 'PATCH', { abgehakt: k.checked });
    k.closest('.posten').classList.toggle('ab', k.checked);
  });
  $$('[data-weg]').forEach(b => b.onclick = async () => { await ruf('/api/einkauf/' + b.dataset.weg, 'DELETE'); zeigeEinkauf(); });
  $$('[data-vorrat]').forEach(b => b.onclick = async () => {
    await ruf('/api/vorrat', 'POST', { name: b.dataset.vorrat });
    b.textContent = 'gemerkt';
    b.disabled = true;
  });
  const neu = async () => {
    const name = $('#neuname').value.trim();
    if (!name) return;
    await ruf(`/api/plan/${plan.id}/einkauf`, 'POST', { name, menge: 0 });
    zeigeEinkauf();
  };
  $('#neuposten').onclick = neu;
  $('#neuname').onkeydown = (e) => { if (e.key === 'Enter') neu(); };
}

// ---------- Rezepte ----------

async function zeigeRezepte() {
  const [rezepte, werte] = await Promise.all([ruf('/api/rezepte'), ruf('/api/rezepte/naehrwerte').catch(() => ({}))]);
  setze(`<div class="seitenkopf">
      <div><h1>Rezepte</h1><p class="unterzeile">${rezepte.length} im Pool, aus dem die Woche geplant wird</p></div>
      <a class="knopf haupt" href="#/rezept-neu">${ICON.plus} Rezept anlegen</a>
    </div>
    ${rezepte.length ? `<div class="suchfeld" style="margin-bottom:18px">${ICON.lupe}
      <input id="rsuche" type="search" placeholder="Nach Gericht oder Zutat suchen" aria-label="Rezepte durchsuchen"></div>
      <div class="kacheln" id="rliste"></div>`
    : `<div class="feld leer"><h2>Der Pool ist leer</h2><p>Füge ein Rezept ein oder schreib es selbst auf.</p>
      <a class="knopf haupt" href="#/rezept-neu">Rezept anlegen</a></div>`}`);
  if (!rezepte.length) return;
  const liste = () => {
    const q = $('#rsuche').value.toLowerCase();
    const t = rezepte.filter(r => !q || r.titel.toLowerCase().includes(q) || r.zutaten.some(z => z.name.toLowerCase().includes(q)));
    $('#rliste').innerHTML = t.length ? t.map(r => `<a class="kachel" href="#/rezept/${esc(r.id)}">
      <h3>${esc(r.titel)}</h3>
      <div class="chips"><span class="chip">${esc(r.dauer_min)} min</span><span class="chip">${esc(KOST[r.kost] || r.kost)}</span>
        <span class="chip">${esc(r.portionen)} Portionen</span></div>
      <div class="fuss">${streifen(werte[r.id])}${kcal(werte[r.id], 'kcal')}</div>
    </a>`).join('') : '<p class="leise">Kein Rezept passt.</p>';
  };
  liste();
  $('#rsuche').oninput = liste;
}

async function zeigeRezept(id) {
  const [r, nw] = await Promise.all([ruf('/api/rezepte/' + id), ruf(`/api/rezepte/${id}/naehrwerte`)]);
  setze(`<a class="zurueck" href="#/rezepte">${ICON.links} Alle Rezepte</a>
    <div class="seitenkopf"><div><h1>${esc(r.titel)}</h1>
      <div class="chips" style="margin-top:12px"><span class="chip">${esc(r.dauer_min)} min</span><span class="chip">${esc(KOST[r.kost] || r.kost)}</span>
        <span class="chip">${esc(AUFWAND[r.aufwand] || r.aufwand)}</span><span class="chip">${esc(r.portionen)} Portionen</span>
        ${r.zuletzt_gekocht ? `<span class="chip">zuletzt gekocht am ${datum(r.zuletzt_gekocht, { day: 'numeric', month: 'long' })}</span>` : ''}</div>
      ${r.beschreibung ? `<p class="unterzeile" style="max-width:70ch">${esc(r.beschreibung)}</p>` : ''}</div></div>
    <div class="spalten">
      <div>
        <section class="feld"><h2>Zutaten</h2><div class="tabelle">
          <table class="zutaten"><thead><tr><th>Menge</th><th>Zutat</th><th>Gerechnet als</th><th class="z">kcal</th><th></th></tr></thead>
          <tbody>${nw.zutaten.map((z, i) => `<tr>
            <td class="zahl" style="white-space:nowrap">${z.menge ? zahl(z.menge, 2) : ''} ${esc(z.einheit)}</td>
            <td>${esc(z.name)}</td>
            <td><div class="zuordnung">${z.lebensmittel ? `<a href="#/lebensmittel/${encodeURIComponent(z.lebensmittel.id)}">${esc(z.lebensmittel.name)}</a>
                ${z.gramm ? `<span class="leise klein">${zahl(z.gramm, 0)} g</span>` : ''}` : ''}
              ${z.von_hand ? '<span class="chip">von Hand</span>' : ''}

// Auswahl eines Lebensmittels fuer eine Zutat; gilt fuer alle Rezepte mit dieser Zutat.
function ordneZu(zutat, danach) {
  const d = $('#dialog');
  d.innerHTML = `<div class="zwischen"><div><h2 style="margin:0">${esc(zutat.name)}</h2>
      <p class="hinweis" style="margin:4px 0 0">Gilt für jedes Rezept mit dieser Zutat.</p></div>
      <button class="knopf still" id="zu" aria-label="Schließen">${ICON.weg}</button></div>
    <div class="raster2"><div><label class="ueber" for="lsuche">Lebensmittel suchen</label><input id="lsuche" type="search" value="${esc(zutat.name)}"></div>
      <div><label class="ueber" for="lstueck">Gewicht eines Stücks in g</label><input id="lstueck" type="number" min="0" placeholder="nur bei Stückangaben"></div></div>
    <label class="haken abstand klein"><input type="checkbox" id="lmarken"> Auch Markenprodukte zeigen</label>
    <div class="wahlliste" id="lliste"></div>
    <div class="reihe abstand"><button class="knopf" id="auslassen">Nicht mitrechnen</button>
      <button class="knopf" id="auto">Wieder automatisch zuordnen</button></div>`;
  let warte, lauf = 0;
  const suche = async () => {
    const nr = ++lauf;
    const q = encodeURIComponent($('#lsuche').value);
    const marken = $('#lmarken').checked;
    const [a, b] = await Promise.all([
      ruf(`/api/lebensmittel?grenze=40&dach=1&q=${q}${marken ? '' : '&quelle=bls'}`),
      marken ? Promise.resolve({ treffer: [] }) : ruf(`/api/lebensmittel?grenze=10&q=${q}&quelle=eigen`)]);
    if (nr !== lauf) return;
    const t = [...b.treffer, ...a.treffer];
    $('#lliste').innerHTML = t.length ? t.map(l => `<button data-id="${esc(l.id)}">
      <span>${esc(l.name)}${l.marke ? ` <span class="leise">${esc(l.marke)}</span>` : ''}</span>
      <span class="leise klein">${zahl(l.kern.ENERCC, 0)} kcal je 100 g</span></button>`).join('')
      : '<p class="leer">Nichts gefunden. Ein kürzeres Wort hilft oft.</p>';
  };
  const setzeZu = async (lebensmittel) => {
    await ruf('/api/zuordnung', 'PUT', { zutat: zutat.name, lebensmittel, stueck_g: Number($('#lstueck').value) || 0 });
    d.close();
    danach();
  };
  $('#lsuche').oninput = () => { clearTimeout(warte); warte = setTimeout(suche, 220); };
  $('#lmarken').onchange = suche;
  $('#lliste').onclick = (e) => { const b = e.target.closest('button[data-id]'); if (b) setzeZu(b.dataset.id); };
  $('#auslassen').onclick = () => setzeZu('-');
  $('#auto').onclick = async () => { await ruf('/api/zuordnung/' + encodeURIComponent(zutat.name), 'DELETE'); d.close(); danach(); };
  $('#zu').onclick = () => d.close();
  suche();
  d.showModal();
}

// "200 g Mehl", "2 EL Öl", "1 Zwiebel", "Pfeffer"
function leseZutat(zeile) {
  const t = zeile.trim().replace(/^[-•*]\s*/, '');
  const m = t.match(/^(\d+(?:[.,]\d+)?|\d+\/\d+)?\s*(\S+)?\s*(.*)$/);
  if (!m) return null;
  let menge = 0;
  if (m[1]) menge = m[1].includes('/') ? m[1].split('/').reduce((a, b) => a / b) : Number(m[1].replace(',', '.'));
  const einheit = EINHEITEN.find(e => e.toLowerCase() === (m[2] || '').toLowerCase());
  const name = einheit ? m[3] : [m[2], m[3]].filter(Boolean).join(' ');
  return name ? { menge, einheit: einheit || (menge ? 'Stück' : ''), name: name.trim(), kategorie: '' } : null;
}

        <section class="feld"><h2>Lebensmitteldatenbank</h2>
          ${db.quellen.map(q => `<div class="bestand"><div><b>${esc(q.name)}</b>
            <div class="hinweis klein">${q.lizenz ? `Lizenz ${esc(q.lizenz)}` : 'von dir angelegt'}${q.eingelesen ? `, eingelesen am ${esc(q.eingelesen)}` : ''}${q.adresse ? `, <a href="${esc(q.adresse)}" target="_blank" rel="noopener">zur Quelle</a>` : ''}</div></div>
            <div class="zahlgross">${zahl(q.anzahl, 0)}</div></div>`).join('')}
          <div class="abstand" id="importfeld">${importText(db.import)}</div>
        </section>
        <section class="feld"><h2>Vorrat</h2>
          <p class="hinweis" style="margin-top:0">Was immer im Haus ist, kommt nicht auf die Einkaufsliste.</p>
          <div class="chips">${vorrat.map(v => `<span class="chip">${esc(v)}<button class="knopf still" style="padding:0 2px" data-vweg="${esc(v)}" aria-label="${esc(v)} entfernen">${ICON.weg}</button></span>`).join('') || '<span class="leise">Noch nichts eingetragen.</span>'}</div>
          <div class="reihe abstand"><input id="vneu" placeholder="Zum Beispiel Salz" aria-label="Vorrat ergänzen" style="flex:1;min-width:180px"><button class="knopf" id="vplus">Hinzufügen</button></div>
        </section>
        <section class="feld"><h2>Zuordnungen von Hand</h2>
          ${zuordnung.length ? `<table><tbody>${zuordnung.sort((a, b) => a.zutat.localeCompare(b.zutat)).map(z => `<tr>
            <td>${esc(z.zutat)}</td>
            <td>${z.lebensmittel === '-' ? '<span class="leise">wird nicht mitgerechnet</span>' : `<a href="#/lebensmittel/${encodeURIComponent(z.lebensmittel)}">${esc(z.lebensmittel)}</a>`}
              ${z.stueck_g ? `<span class="chip">${zahl(z.stueck_g, 0)} g je Stück</span>` : ''}</td>
            <td class="z"><button class="knopf still" data-zweg="${esc(z.zutat)}" aria-label="Zuordnung ${esc(z.zutat)} löschen">${ICON.weg}</button></td></tr>`).join('')}</tbody></table>`
          : '<p class="leise" style="margin:0">Keine. Alle Zutaten werden automatisch zugeordnet; ändern lässt sich das in jedem Rezept.</p>'}
        </section>
      </div>
      <aside>
        <section class="feld"><h2>Assistent</h2>
          <p style="margin:0"><span class="punkt ${s.ollama ? 'an' : ''}"></span>${esc(s.modell)} ist ${s.ollama ? 'bereit' : 'nicht erreichbar'}</p>
          ${s.modelle?.length ? `<p class="hinweis klein">Auf dem Rechner vorhanden: ${s.modelle.map(esc).join(', ')}</p>` : ''}
        </section>
        <p class="quellangabe">Nährwerte: Max Rubner-Institut (2025), Bundeslebensmittelschlüssel (BLS) 4.0,
          <a href="https://doi.org/10.25826/Data20251217-134202-0" target="_blank" rel="noopener">DOI 10.25826/Data20251217-134202-0</a>, CC BY 4.0.
          Markenprodukte: <a href="https://world.openfoodfacts.org" target="_blank" rel="noopener">Open Food Facts</a>, ODbL 1.0.
          Gramm für Stück, EL und TL sind geschätzt.</p>
      </aside>
    </div>`);
  verdrahteImport();
  if (db.import.laeuft) beobachteImport();
  $$('[data-vweg]').forEach(b => b.onclick = async () => { await ruf('/api/vorrat/' + encodeURIComponent(b.dataset.vweg), 'DELETE'); zeigeMehr(); });
  $$('[data-zweg]').forEach(b => b.onclick = async () => { await ruf('/api/zuordnung/' + encodeURIComponent(b.dataset.zweg), 'DELETE'); zeigeMehr(); });
  const plus = async () => { const name = $('#vneu').value.trim(); if (!name) return; await ruf('/api/vorrat', 'POST', { name }); zeigeMehr(); };
  $('#vplus').onclick = plus;
  $('#vneu').onkeydown = (e) => { if (e.key === 'Enter') plus(); };
}

function verdrahteImport() {
  const b = $('#importstart');
  if (b) b.onclick = async () => {
    b.disabled = true;
    try { await ruf('/api/lebensmittel/import', 'POST'); } catch (f) { $('#importfeld').insertAdjacentHTML('beforeend', `<p class="meldung">${esc(f.message)}</p>`); }
    beobachteImport();
  };
}

function beobachteImport() {
  clearInterval(importUhr);
  importUhr = setInterval(async () => {
    const feld = $('#importfeld');
    if (!feld) { clearInterval(importUhr); return; }
    const d = await ruf('/api/lebensmittel/quellen').catch(() => null);
    if (!d) return;
    feld.innerHTML = importText(d.import);
    verdrahteImport();
    if (!d.import.laeuft) { clearInterval(importUhr); zeigeMehr(); }
  }, 3000);
}

function importText(imp) {
  if (imp.laeuft) {
    // Der Export hat rund 4,5 Millionen Zeilen; genauer steht es vorher nirgends.
    const anteil = imp.schritt === 'liest Produkte' ? Math.min(92, imp.gelesen / 4.5e6 * 92) : imp.schritt === 'lädt herunter' ? 1 : 96;
    return `<b>Markenprodukte werden eingelesen</b>
      <p class="hinweis klein" style="margin:4px 0 0">${esc(imp.schritt)}: ${zahl(imp.gelesen, 0)} Zeilen gelesen, ${zahl(imp.genommen, 0)} übernommen.
        Die Suche läuft währenddessen mit dem bisherigen Stand weiter.</p>
      <div class="fortschritt"><i style="width:${anteil.toFixed(1)}%"></i></div>`;
  }
  return `<div class="zwischen" style="flex-wrap:wrap"><p class="hinweis klein" style="margin:0">${imp.fehler ? `Letzter Import abgebrochen: ${esc(imp.fehler)}`
    : imp.fertig ? `Letzter Import fertig am ${esc(imp.fertig)}.` : 'Markenprodukte werden alle 30 Tage von selbst aufgefrischt.'}</p>
    <button class="knopf" id="importstart">Jetzt aktualisieren</button></div>`;
}

// ---------- Wege ----------

const wege = [
  [/^#\/woche$/, 'woche', zeigeWoche],
  [/^#\/einkauf$/, 'einkauf', zeigeEinkauf],
  [/^#\/rezepte$/, 'rezepte', zeigeRezepte],
  [/^#\/rezept-neu$/, 'rezepte', zeigeNeu],
  [/^#\/rezept\/(\d+)$/, 'rezepte', zeigeRezept],
  [/^#\/lebensmittel$/, 'lebensmittel', zeigeLebensmittelSuche],
  [/^#\/lebensmittel\/(.+)$/, 'lebensmittel', (id) => zeigeLebensmittel(decodeURIComponent(id))],
  [/^#\/eigenes$/, 'lebensmittel', () => bearbeiteEigenes(null)],
  [/^#\/eigenes\/(.+)$/, 'lebensmittel', (id) => bearbeiteEigenes(decodeURIComponent(id))],
  [/^#\/mehr$/, 'mehr', zeigeMehr],
];

async function folge() {
  if (zustand.status?.kennwort && !zustand.status.angemeldet) { zeigeAnmeldung(); return; }
  const hash = location.hash || '#/woche';
  const [muster, bereich, zeige] = wege.find(([m]) => m.test(hash)) || wege[0];
  $$('.nav a').forEach(a => {
    if (a.dataset.bereich === bereich) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
  });
  const teile = hash.match(muster) || [];
  try {
    await zeige(...teile.slice(1));
    window.scrollTo(0, 0);
  } catch (f) {
    if (f.message !== 'Anmeldung nötig') {
      setze(`<div class="feld leer"><h2>Das hat nicht geklappt</h2><p>${esc(f.message)}</p>
        <button class="knopf" id="nochmal">Erneut versuchen</button></div>`);
      $('#nochmal').onclick = folge;
    }
  }
}
window.addEventListener('hashchange', folge);

async function start() {
  await ladeStatus();
  await folge();
}
start().catch(f => setze(`<div class="feld leer"><h2>Foodr ist nicht erreichbar</h2><p>${esc(f.message)}</p></div>`));
</script>
</body>
</html>
