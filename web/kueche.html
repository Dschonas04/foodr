<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Foodr Küche</title>
<link rel="icon" href="favicon.svg">
<style>
:root {
  --grund: #f6f5f2; --flaeche: #ffffff; --flaeche2: #efede8; --tinte: #2f2d29; --leise: #85827b;
  --linie: #e4e1da; --akzent: #d9622b; --akzent-hell: #fbe9df; --gut: #2f8f5b; --gut-hell: #e3f3ea;
  --warn: #c0392b; --schatten: 0 1px 2px rgba(0,0,0,.05), 0 4px 16px rgba(0,0,0,.04);
  --schrift: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --grund: #161615; --flaeche: #21201e; --flaeche2: #2b2a27; --tinte: #ecebe7; --leise: #9d9a93;
    --linie: #34322e; --akzent: #f08a55; --akzent-hell: rgba(240,138,85,.14); --gut: #5cc48a; --gut-hell: rgba(92,196,138,.14);
    --warn: #f28b82; --schatten: none; color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--grund); color: var(--tinte); font: 15px/1.5 var(--schrift); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--akzent); outline-offset: 2px; }
[hidden] { display: none !important; }

.kopf { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--grund) 88%, transparent);
        backdrop-filter: blur(10px); border-bottom: 1px solid var(--linie); }
.kopf-innen { max-width: 980px; margin: 0 auto; padding: 12px 16px 0; }
.kopfzeile { display: flex; align-items: center; gap: 10px; }
.kopfzeile img { width: 28px; height: 28px; }
.kopfzeile h1 { font-size: 17px; margin: 0; letter-spacing: -.01em; }
.ganz { display: inline-flex; align-items: center; gap: 5px; font-size: 13px; color: var(--leise); text-decoration: none;
        padding: 5px 10px; border-radius: 999px; border: 1px solid var(--linie); }
.ganz:hover { color: var(--tinte); background: var(--flaeche); }
.ganz svg { width: 14px; height: 14px; }
.kopfzeile .woche { margin-left: auto; display: flex; gap: 4px; background: var(--flaeche2); padding: 3px; border-radius: 999px; }
.woche button { border: 0; background: transparent; padding: 4px 12px; border-radius: 999px; font-size: 13px; color: var(--leise); }
.woche button.an { background: var(--flaeche); color: var(--tinte); box-shadow: var(--schatten); }
.reiter { display: flex; gap: 2px; overflow-x: auto; margin-top: 10px; scrollbar-width: none; }
.reiter button { border: 0; background: none; padding: 9px 14px 11px; color: var(--leise); font-weight: 500;
                 border-bottom: 2px solid transparent; white-space: nowrap; display: inline-flex; gap: 7px; align-items: center; }
.reiter button.an { color: var(--tinte); border-bottom-color: var(--akzent); }
.reiter svg { width: 17px; height: 17px; }

main { max-width: 980px; margin: 0 auto; padding: 18px 16px 48px; }
.karte { background: var(--flaeche); border: 1px solid var(--linie); border-radius: 14px; box-shadow: var(--schatten); }
.leise { color: var(--leise); }
.klein { font-size: 13px; }
h2 { font-size: 15px; margin: 0 0 10px; }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 12px; padding: 2px 9px; border-radius: 999px; background: var(--flaeche2); color: var(--leise); }
.chip.vegan, .chip.vegetarisch { background: var(--gut-hell); color: var(--gut); }
.chip.fisch { background: rgba(63,111,168,.14); color: #4a82c4; }
.chip.fleisch { background: var(--akzent-hell); color: var(--akzent); }

.knopf { border: 1px solid var(--linie); background: var(--flaeche); border-radius: 10px; padding: 7px 12px;
         display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 500; }
.knopf:hover { background: var(--flaeche2); }
.knopf:disabled { opacity: .55; cursor: default; }
.knopf.haupt { background: var(--akzent); border-color: var(--akzent); color: #fff; }
.knopf.haupt:hover { filter: brightness(1.05); }
.knopf.gut { background: var(--gut-hell); border-color: transparent; color: var(--gut); }
.knopf svg { width: 16px; height: 16px; }
.symbolknopf { border: 0; background: transparent; width: 34px; height: 34px; border-radius: 9px; display: inline-grid;
               place-items: center; color: var(--leise); }
.symbolknopf:hover { background: var(--flaeche2); color: var(--tinte); }
.symbolknopf svg { width: 18px; height: 18px; }

/* Heute */
.heute { padding: 20px; display: grid; gap: 12px; margin-bottom: 18px;
         background: linear-gradient(135deg, var(--akzent-hell), transparent 60%), var(--flaeche); }
.heute .tagname { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--akzent); }
.heute .titel { font-size: clamp(22px, 4vw, 30px); font-weight: 700; letter-spacing: -.02em; line-height: 1.15; margin: 0; }
.heute .hinweis { font-size: 14px; color: var(--leise); margin: 0; }
.heute .aktionen { display: flex; flex-wrap: wrap; gap: 8px; }

/* Woche */
.tage { display: grid; gap: 8px; }
.tag { padding: 12px 14px; display: grid; grid-template-columns: 52px 1fr auto; gap: 12px; align-items: center; }
.tag.heute-markiert { border-color: var(--akzent); }
.tag .datum { text-align: center; line-height: 1.1; }
.tag .datum b { display: block; font-size: 13px; }
.tag .datum span { font-size: 20px; font-weight: 700; }
.tag .name { font-weight: 600; }
.tag.gekocht .name { text-decoration: line-through; color: var(--leise); }
.tag .rechts { display: flex; gap: 2px; }
.details { grid-column: 1 / -1; border-top: 1px solid var(--linie); padding-top: 12px; display: grid; gap: 12px;
           grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr); }
.details ul, .details ol { margin: 0; padding-left: 18px; }
.details li { margin: 2px 0; }
@media (max-width: 640px) { .details { grid-template-columns: 1fr; } .tag { grid-template-columns: 44px 1fr; } .tag .rechts { grid-column: 1 / -1; justify-content: flex-end; } }

.wunsch { grid-column: 1 / -1; display: flex; gap: 8px; }
.feld { width: 100%; padding: 9px 12px; border: 1px solid var(--linie); border-radius: 10px; background: var(--flaeche); }
.feld:focus { outline: 2px solid var(--akzent); outline-offset: -1px; }
.denkt { display: inline-flex; gap: 8px; align-items: center; color: var(--leise); font-size: 13px; }
.denkt::before { content: ""; width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--linie);
                 border-top-color: var(--akzent); animation: dreh 0.8s linear infinite; }
@keyframes dreh { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .denkt::before { animation: none; } }

/* Rezepte */
.suche { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
.suche .feld { flex: 1; min-width: 200px; }
.filter { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
.filter button { border: 1px solid var(--linie); background: var(--flaeche); border-radius: 999px; padding: 4px 12px; font-size: 13px; }
.filter button.an { background: var(--tinte); color: var(--grund); border-color: var(--tinte); }
.gruppen { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
.karte.gruppe { text-align: left; padding: 14px 16px; display: grid; gap: 4px; cursor: pointer; color: inherit; font: inherit; }
.karte.gruppe:hover { border-color: var(--tinte); }
.gname { font-weight: 600; font-size: 16px; }
.gbsp { overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.ghead { margin: 20px 0 10px; font-size: 16px; }
.gruppenkopf { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
.gruppenkopf h2 { margin: 0; font-size: 18px; }
.wahl { border: 1px solid var(--linie); background: var(--flaeche); color: inherit; border-radius: 999px; padding: 4px 10px; font-size: 13px; }
.raster { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
.rezept { padding: 14px; display: grid; gap: 8px; align-content: start; }
.rezept .name { font-weight: 600; }
.rezept .unten { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.rezept select { padding: 6px 8px; border-radius: 9px; border: 1px solid var(--linie); background: var(--flaeche); font-size: 13px; }
.erfinden { margin-top: 18px; padding: 16px; display: grid; gap: 10px; }

/* Planen */
.planen { padding: 18px; display: grid; gap: 6px; max-width: 640px; }
.planen label.ueber { font-weight: 600; font-size: 13px; margin-top: 12px; }
.wahl { display: flex; flex-wrap: wrap; gap: 6px; }
.wahl label { display: inline-flex; gap: 6px; align-items: center; border: 1px solid var(--linie); border-radius: 999px; padding: 4px 11px; font-size: 13px; }
.wahl input { accent-color: var(--akzent); }

@media (max-width: 520px) {
  .ganz { font-size: 0; padding: 6px; gap: 0; }
  .reiter button { padding: 9px 10px 11px; font-size: 14px; gap: 5px; }
  .reiter svg { display: none; }
  .kopfzeile .woche button { padding: 4px 9px; }
}

/* Chat */
.chat { display: grid; grid-template-rows: 1fr auto; height: calc(100vh - 150px); min-height: 380px; }
.verlauf { overflow-y: auto; padding: 6px 2px 12px; display: flex; flex-direction: column; gap: 10px; }
.blase { max-width: 78%; padding: 10px 14px; border-radius: 16px; white-space: pre-wrap; word-wrap: break-word; }
.blase.ich { align-self: flex-end; background: var(--akzent); color: #fff; border-bottom-right-radius: 6px; }
.blase.ki { align-self: flex-start; background: var(--flaeche); border: 1px solid var(--linie); border-bottom-left-radius: 6px; }
.taten { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.taten span { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; padding: 2px 8px; border-radius: 999px;
              background: var(--gut-hell); color: var(--gut); }
.taten svg { width: 12px; height: 12px; }
.vorschlaege { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
.vorschlaege button { border: 1px solid var(--linie); background: var(--flaeche); border-radius: 999px; padding: 5px 12px; font-size: 13px; }
.eingabe { display: flex; gap: 8px; }
.eingabe textarea { resize: none; height: 44px; }

/* Lebensmittel */
.lm { list-style: none; margin: 0; padding: 0; }
.lm > li { border-bottom: 1px solid var(--linie); }
.lm > li:last-child { border-bottom: 0; }
.lm-zeile { width: 100%; border: 0; background: none; text-align: left; display: grid; grid-template-columns: 40px 1fr auto;
            gap: 12px; align-items: center; padding: 10px 14px; }
.lm-zeile:hover { background: var(--flaeche2); }
.lm-bild { width: 40px; height: 40px; border-radius: 8px; background: var(--flaeche2); object-fit: cover; display: grid; place-items: center;
           font-size: 11px; color: var(--leise); }
.lm-name { font-weight: 500; }
.lm-kcal { font-variant-numeric: tabular-nums; font-weight: 600; text-align: right; }
.lm-kcal small { display: block; font-weight: 400; color: var(--leise); font-size: 12px; }
.makros { display: flex; gap: 10px; flex-wrap: wrap; font-size: 12px; color: var(--leise); }
.makros b { color: var(--tinte); font-weight: 600; }
.naehr { padding: 4px 14px 16px 66px; display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
.naehr h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--leise); margin: 0 0 4px; }
.naehr table { width: 100%; border-collapse: collapse; font-size: 13px; }
.naehr td { padding: 2px 0; border-bottom: 1px dotted var(--linie); }
.naehr td.z { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
@media (max-width: 640px) { .naehr { padding-left: 14px; } }

/* Einkauf */
.gruppe { margin-bottom: 14px; }
.gruppe h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--leise); }
.posten { list-style: none; margin: 0; padding: 0; }
.posten li { display: flex; gap: 10px; align-items: center; padding: 9px 14px; border-bottom: 1px solid var(--linie); }
.posten li:last-child { border-bottom: 0; }
.posten input { width: 18px; height: 18px; accent-color: var(--gut); }
.posten .weg { text-decoration: line-through; color: var(--leise); }
.posten .menge { margin-left: auto; color: var(--leise); font-variant-numeric: tabular-nums; font-size: 13px; }

.meldung { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); background: var(--tinte); color: var(--grund);
           padding: 9px 16px; border-radius: 999px; font-size: 14px; z-index: 20; box-shadow: 0 6px 20px rgba(0,0,0,.2); }
.leer { padding: 28px; text-align: center; color: var(--leise); }

/* Weiche Formen: runde Ecken, keine harten Linien, Flächen statt Rahmen */
:root { --schatten: 0 1px 3px rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.06); --linie-weich: color-mix(in srgb, var(--linie) 60%, transparent); }
@media (prefers-color-scheme: dark) { :root { --schatten: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25); } }
.kopf { border-bottom: 0; }
.kopf-innen { padding-bottom: 10px; }
.reiter { gap: 4px; }
.reiter button { border-bottom: 0; border-radius: 999px; padding: 7px 14px; }
.reiter button:hover { background: var(--flaeche2); color: var(--tinte); }
.reiter button.an { background: var(--akzent-hell); color: var(--akzent); }
.karte { border-color: transparent; border-radius: 24px; }
.heute { border-radius: 28px; padding: 24px; }
.tag { border-radius: 22px; padding: 12px 16px; }
.tag.heute-markiert { border-color: transparent; box-shadow: 0 0 0 2px var(--akzent), var(--schatten); }
.details { border-top: 1px solid var(--linie-weich); }
.knopf { border-radius: 999px; padding: 8px 16px; border-color: var(--linie-weich); background: var(--flaeche2); }
.knopf:hover { background: color-mix(in srgb, var(--flaeche2) 70%, var(--tinte) 8%); }
.heute .knopf { background: var(--flaeche); }
.symbolknopf { border-radius: 50%; }
.feld { border-radius: 18px; border-color: var(--linie-weich); background: var(--flaeche2); padding: 10px 16px; }
input.feld { border-radius: 999px; }
.chip, .filter button, .wahl, .wahl label, .vorschlaege button { border-color: var(--linie-weich); }
.rezept select { border-radius: 999px; padding: 6px 12px; border-color: var(--linie-weich); }
.karte.gruppe { transition: transform .15s ease, box-shadow .15s ease; }
.karte.gruppe:hover { border-color: transparent; transform: translateY(-2px); box-shadow: 0 2px 6px rgba(0,0,0,.06), 0 14px 32px rgba(0,0,0,.09); }
@media (prefers-reduced-motion: reduce) { .karte.gruppe:hover { transform: none; } }
.blase { border-radius: 22px; }
.blase.ich { border-bottom-right-radius: 8px; }
.blase.ki { border-color: transparent; box-shadow: var(--schatten); border-bottom-left-radius: 8px; }
.lm-bild { border-radius: 14px; }
.lm > li, .posten li { border-bottom-color: var(--linie-weich); }
.lm-zeile { border-radius: 18px; }
.naehr td { border-bottom-color: var(--linie-weich); }
.posten input { border-radius: 50%; }

/* Kalender */
.kal { padding: 18px; }
.kal-kopf { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; }
.kal-kopf h2 { margin: 0 auto 0 4px; font-size: 20px; letter-spacing: -.01em; }
.kal-kopf .knopf { padding: 6px 14px; }
.kal-raster { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.kal-wt { text-align: center; font-size: 12px; font-weight: 600; color: var(--leise); text-transform: uppercase; letter-spacing: .05em; padding-bottom: 4px; }
.kal-tag { position: relative; min-height: 92px; border: 0; border-radius: 18px; background: var(--flaeche2); padding: 8px 9px; text-align: left;
           display: flex; flex-direction: column; gap: 4px; color: inherit; transition: transform .12s ease, background .12s ease; }
.kal-tag:hover { background: color-mix(in srgb, var(--flaeche2) 80%, var(--akzent) 10%); }
.kal-tag.fremd { opacity: .4; }
.kal-tag.leer-tag { background: color-mix(in srgb, var(--flaeche2) 45%, transparent); }
.kal-tag .zahl { font-size: 13px; font-weight: 600; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; margin: -3px 0 0 -3px; }
.kal-tag.jetzt .zahl { background: var(--akzent); color: #fff; }
.kal-tag.gewaehlt { box-shadow: 0 0 0 2px var(--akzent); }
.kal-tag .gericht { font-size: 12.5px; line-height: 1.3; font-weight: 500; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; }
.kal-tag.gekocht .gericht { color: var(--leise); text-decoration: line-through; }
.kal-tag .punkt { position: absolute; top: 10px; right: 10px; width: 8px; height: 8px; border-radius: 50%; background: var(--leise); }
.punkt.vegan, .punkt.vegetarisch { background: var(--gut); }
.punkt.fisch { background: #4a82c4; }
.punkt.fleisch { background: var(--akzent); }
.kal-legende { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 14px; font-size: 12px; color: var(--leise); }
.kal-legende span { display: inline-flex; align-items: center; gap: 6px; }
.kal-legende .punkt { position: static; display: inline-block; width: 8px; height: 8px; border-radius: 50%; }
.kal-auswahl { margin-top: 14px; padding: 20px; display: grid; gap: 10px; }
.kal-auswahl .tagname { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--akzent); }
.kal-auswahl .titel { font-size: 22px; font-weight: 700; letter-spacing: -.01em; margin: 0; }
@media (max-width: 640px) {
  .kal { padding: 12px; }
  .kal-raster { gap: 4px; }
  .kal-tag { min-height: 54px; border-radius: 14px; padding: 6px; align-items: center; }
  .kal-tag .gericht { display: none; }
  .kal-tag .zahl { margin: 0; }
  .kal-tag .punkt { position: static; margin-top: 2px; }
}
@media (prefers-reduced-motion: reduce) { .kal-tag { transition: none; } }

/* Neutral: Grautöne, keine Farbcodes, ein Kopf in einer Zeile */
:root { --grund: #f5f5f5; --flaeche: #ffffff; --flaeche2: #efefef; --tinte: #1f1f1f; --leise: #7c7c7c; --linie: #e3e3e3;
        --akzent: #1f1f1f; --akzent-hell: rgba(0,0,0,.06); --gut: #1f1f1f; --gut-hell: #e9e9e9; }
@media (prefers-color-scheme: dark) { :root { --grund: #121212; --flaeche: #1d1d1d; --flaeche2: #292929; --tinte: #ececec; --leise: #9a9a9a;
        --linie: #333; --akzent: #ececec; --akzent-hell: rgba(255,255,255,.08); --gut: #ececec; --gut-hell: #2f2f2f; } }
.chip.vegan, .chip.vegetarisch, .chip.fisch, .chip.fleisch { background: var(--flaeche2); color: var(--leise); }
.knopf.haupt, .blase.ich { color: var(--grund); }
.kal-tag.jetzt .zahl { color: var(--grund); }
.punkt, .punkt.vegan, .punkt.vegetarisch, .punkt.fisch, .punkt.fleisch { background: var(--leise) !important; }
.kal-legende { display: none; }
.kopf-innen { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 12px 16px; }
.reiter { margin: 0; flex: 1; min-width: 0; }
.reiter button { font-size: 15px; }
.reiter button.an { background: var(--flaeche); color: var(--tinte); box-shadow: var(--schatten); }
.periode { display: flex; align-items: center; gap: 2px; margin-left: auto; }
.periode #wochenName { border: 0; background: var(--flaeche); border-radius: 999px; padding: 6px 14px; font-size: 14px; font-weight: 500; white-space: nowrap; box-shadow: var(--schatten); }
.periode a.symbolknopf { margin-left: 6px; }
.ansicht { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
.ansicht .knopf { margin-left: auto; }
.segment { display: inline-flex; background: var(--flaeche2); border-radius: 999px; padding: 3px; }
.segment button { border: 0; background: none; border-radius: 999px; padding: 5px 14px; font-size: 14px; color: var(--leise); }
.segment button.an { background: var(--flaeche); color: var(--tinte); box-shadow: var(--schatten); }
.tag.heute-markiert { box-shadow: 0 0 0 1.5px var(--tinte), var(--schatten); }
.tag .heute-text { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--leise); display: block; }
.tag .hinweis-zeile { font-size: 13px; color: var(--leise); margin-top: 4px; }
.kal { padding: 12px; }
@media (max-width: 520px) { .kopf-innen { gap: 6px; padding: 10px 12px; } .reiter button { padding: 6px 11px; font-size: 14px; } .periode { width: 100%; justify-content: flex-start; } .periode a.symbolknopf { margin-left: auto; } }
.kal-tag .punkt { display: none; }
@media (max-width: 640px) { .kal-tag .punkt { display: block; } }
</style>
</head>
<body>
<header class="kopf">
  <div class="kopf-innen">
    <nav class="reiter" role="tablist">
      <button data-reiter="woche" data-tab="plan" class="an">Plan</button>
      <button data-reiter="rezepte" data-tab="rezepte">Rezepte</button>
      <button data-reiter="einkauf" data-tab="einkauf">Einkauf</button>
      <button data-reiter="chat" data-tab="chat">Chat</button>
    </nav>
    <div class="periode" role="group" aria-label="Zeitraum wählen">
      <button class="symbolknopf" data-wochenschritt="-1" aria-label="Zurück" title="Zurück"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></button>
      <button data-wochenschritt="0" id="wochenName" title="Zurück zu heute">Diese Woche</button>
      <button class="symbolknopf" data-wochenschritt="1" aria-label="Weiter" title="Weiter"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>
      <a class="symbolknopf" id="ganzesFoodr" href="/" target="_blank" rel="noopener" title="Das ganze Foodr in einem neuen Tab" aria-label="Ganzes Foodr"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg></a>
    </div>
  </div>
</header>
<main id="inhalt"></main>
<div class="meldung" id="meldung" role="status" hidden></div>

<script>
const $ = (s, w = document) => w.querySelector(s);
const $$ = (s, w = document) => [...w.querySelectorAll(s)];
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const KOST = { vegan: 'vegan', vegetarisch: 'vegetarisch', fisch: 'Fisch', fleisch: 'Fleisch' };
const WOCHENTAGE = ['montag', 'dienstag', 'mittwoch', 'donnerstag', 'freitag', 'samstag', 'sonntag'];
const TAGNAME = ['Sonntag', 'Montag', 'Dienstag', 'Mittwoch', 'Donnerstag', 'Freitag', 'Samstag'];
const KURZ = ['So', 'Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa'];
const SYM = {
  tauschen: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 0 1 13.7-5.6L20 8.5"/><path d="M20 4v4.5h-4.5"/><path d="M20 12a8 8 0 0 1-13.7 5.6L4 15.5"/><path d="M4 20v-4.5h4.5"/></svg>',
  erfinden: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.8 4.6L18.5 9l-4.7 1.4L12 15l-1.8-4.6L5.5 9l4.7-1.4z"/><path d="M18 15l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8z"/></svg>',
  haken: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  auf: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>',
  senden: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l16-8-6 16-2.5-6.5z"/></svg>',
};

const zustand = { reiter: 'woche', versatz: 0, monat: 0, kal: null, kalTag: null, plan: null, rezepte: null, offen: new Set(), wunschFuer: null,
                  arbeitet: new Set(), suche: '', kost: '', gruppe: '', kueche: '', chat: lesen('foodr-chat', []), regeln: null };

function lesen(k, v) { try { return JSON.parse(sessionStorage.getItem(k)) ?? v; } catch { return v; } }
function merken(k, v) { try { sessionStorage.setItem(k, JSON.stringify(v)); } catch { /* egal */ } }

// Der Schluessel kommt im Anker (#k=...), bleibt nur in dieser Sitzung und
// geht als Kopfzeile mit: eingebettet verlaesst sich die Seite nicht auf Kekse.
const SCHLUESSEL = (() => {
  const m = location.hash.match(/k=([0-9a-f]{64})/);
  if (m) {
    try { sessionStorage.setItem('foodr-kueche-k', m[1]); } catch { /* egal */ }
    history.replaceState(null, '', location.pathname);
    return m[1];
  }
  try { return sessionStorage.getItem('foodr-kueche-k') || ''; } catch { return ''; }
})();

// Eingebettet unter fremdem Pfad (etwa /foodr/ hinter dem Proxy von Home
// Assistant) gehen alle Aufrufe unter diesen Pfad, die volle App liegt dann am
// eigenen Port.
const BASIS = location.pathname.replace(/\/kueche(\.html)?$/, '');
const GANZ = BASIS ? `${location.protocol}//${location.hostname}:8300/` : '/';
document.getElementById('ganzesFoodr')?.setAttribute('href', GANZ);
const mitBasis = (u) => (typeof u === 'string' && u.startsWith('/') && !u.startsWith('//') ? BASIS + u : u);

async function ruf(pfad, methode = 'GET', rumpf) {
  pfad = mitBasis(pfad);
  const kopf = rumpf ? { 'Content-Type': 'application/json' } : {};
  if (SCHLUESSEL) kopf['X-Foodr-Kueche'] = SCHLUESSEL;
  const r = await fetch(pfad, { method: methode, credentials: 'include', headers: kopf, body: rumpf ? JSON.stringify(rumpf) : undefined });
  if (r.status === 401) { zeigeAbgemeldet(); throw new Error('nicht angemeldet'); }
  const text = await r.text();
  let d; try { d = text ? JSON.parse(text) : null; } catch { d = text; }
  if (!r.ok) throw new Error((d && (d.fehler || d.error)) || r.statusText);
  return d;
}

function zeigeAbgemeldet() {
  $('#inhalt').innerHTML = `<div class="karte leer"><p>Foodr kennt diese Ansicht nicht.</p>
    <p class="klein">Öffne sie über die Adresse mit Schlüssel (in Home Assistant hinterlegt) oder melde dich in einem eigenen Tab an.</p>
    <a class="knopf" href="${GANZ}" target="_blank" rel="noopener">Foodr in neuem Tab öffnen</a></div>`;
}

function melden(text) {
  const m = $('#meldung'); m.textContent = text; m.hidden = false;
  clearTimeout(melden.t); melden.t = setTimeout(() => (m.hidden = true), 3500);
}

function montag(versatz = 0) {
  const d = new Date(); d.setHours(12, 0, 0, 0);
  d.setDate(d.getDate() - ((d.getDay() + 6) % 7) + versatz);
  return d.toISOString().slice(0, 10);
}
function planKopf() {
  return `<div class="ansicht"><div class="segment" role="group" aria-label="Ansicht">
    <button data-reiter="woche" class="${zustand.reiter === 'woche' ? 'an' : ''}">Woche</button>
    <button data-reiter="kalender" class="${zustand.reiter === 'kalender' ? 'an' : ''}">Monat</button></div>
    <button class="knopf" data-gehe="planen">${SYM.erfinden}Neu planen</button></div>`;
}
function rezeptKopf() {
  return `<div class="ansicht"><div class="segment" role="group" aria-label="Ansicht">
    <button data-reiter="rezepte" class="${zustand.reiter === 'rezepte' ? 'an' : ''}">Rezepte</button>
    <button data-reiter="lebensmittel" class="${zustand.reiter === 'lebensmittel' ? 'an' : ''}">Lebensmittel</button></div></div>`;
}
const TAB = { woche: 'plan', kalender: 'plan', planen: 'plan', rezepte: 'rezepte', lebensmittel: 'rezepte', einkauf: 'einkauf', chat: 'chat' };
function wochenNameSetzen() {
  const p = $('.periode'); if (p) p.hidden = !['woche', 'kalender', 'planen', 'einkauf'].includes(zustand.reiter);
  if (zustand.reiter === 'kalender') {
    const m = monatsRaster().erster; const b = $('#wochenName');
    if (b) b.textContent = zustand.monat === 0 ? 'Dieser Monat' : `${MONATE[m.getMonth()]} ${m.getFullYear()}`;
    return;
  }
  const v = zustand.versatz; const b = $('#wochenName'); if (!b) return;
  const mo = datum(montag(v)); const so = new Date(mo); so.setDate(mo.getDate() + 6);
  const kurz = (d) => d.toLocaleDateString('de-DE', { day: 'numeric', month: 'short' });
  b.textContent = v === 0 ? 'Diese Woche' : v === 7 ? 'Nächste Woche' : v === -7 ? 'Letzte Woche' : `${kurz(mo)} bis ${kurz(so)}`;
}
const heuteIso = () => { const d = new Date(); d.setHours(12); return d.toISOString().slice(0, 10); };
const datum = (iso) => new Date(iso + 'T12:00:00');

function chips(r) {
  if (!r) return '';
  return `<div class="chips">
    ${r.dauer_min ? `<span class="chip">${r.dauer_min} min</span>` : ''}
    ${r.kost ? `<span class="chip ${esc(r.kost)}">${esc(KOST[r.kost] || r.kost)}</span>` : ''}
    ${r.aufwand ? `<span class="chip">${esc(r.aufwand)}</span>` : ''}
    ${r.kueche && r.kueche !== 'International' ? `<span class="chip">${esc(r.kueche)}</span>` : ''}</div>`;
}

function menge(z) {
  if (!z.menge) return z.einheit && z.einheit !== 'Prise' ? '' : (z.einheit || '');
  const m = Number(z.menge); return `${Number.isInteger(m) ? m : m.toFixed(1).replace('.', ',')} ${z.einheit || ''}`.trim();
}

function details(r) {
  if (!r) return '';
  return `<div class="details">
    <div><h2>Zutaten${r.portionen ? ` <span class="leise klein">für ${r.portionen}</span>` : ''}</h2>
      <ul>${(r.zutaten || []).map((z) => `<li>${esc(menge(z))} ${esc(z.name)}</li>`).join('')}</ul></div>
    <div><h2>Zubereitung</h2><ol>${(r.schritte || []).map((s) => `<li>${esc(s)}</li>`).join('')}</ol>
      ${r.hinweise ? `<p class="leise klein">${esc(r.hinweise)}</p>` : ''}</div></div>`;
}

// ---------------------------------------------------------------- Woche --

async function ladePlan() {
  zustand.plan = await ruf('/api/plan?woche=' + montag(zustand.versatz)).catch(() => null);
}

function wunschZeile(tagId) {
  if (zustand.wunschFuer !== tagId) return '';
  return `<form class="wunsch" data-wunsch="${tagId}">
    <input class="feld" name="wunsch" placeholder="Worauf hast du Lust? (leer lassen für eine Überraschung)" autocomplete="off">
    <button class="knopf haupt">${SYM.erfinden}Erfinden</button></form>`;
}

function zeigeWoche() {
  const p = zustand.plan;
  if (!p || !p.tage?.length) {
    $('#inhalt').innerHTML = planKopf() + `<div class="karte leer"><p>Für diese Woche gibt es noch keinen Plan.</p>
      <button class="knopf haupt" data-gehe="planen">${SYM.erfinden}Woche planen</button></div>`;
    return;
  }
  const heute = heuteIso();
  $('#inhalt').innerHTML = planKopf() + `<div class="tage">${p.tage.map((t) => {
    const r = t.rezept; const d = datum(t.tag); const arbeitet = zustand.arbeitet.has(t.id); const istHeute = t.tag === heute;
    return `<article id="tag-${t.id}" class="karte tag ${t.gekocht ? 'gekocht' : ''} ${istHeute ? 'heute-markiert' : ''}">
      <div class="datum"><b>${KURZ[d.getDay()]}</b><span>${d.getDate()}</span></div>
      <div>${istHeute ? '<span class="heute-text">Heute</span>' : ''}<div class="name">${esc(r ? r.titel : 'nichts geplant')}</div>${chips(r)}
        ${istHeute && t.hinweis ? `<div class="hinweis-zeile">${esc(t.hinweis)}</div>` : ''}
        ${arbeitet ? '<span class="denkt">wird ausgetauscht …</span>' : ''}</div>
      <div class="rechts">
        <button class="symbolknopf" title="Anderes Gericht aus dem Pool" aria-label="Anderes Gericht" data-tauschen="${t.id}" ${arbeitet ? 'disabled' : ''}>${SYM.tauschen}</button>
        <button class="symbolknopf" title="Neues Rezept für diesen Tag" aria-label="Neues Rezept" data-erfinden="${t.id}" ${arbeitet ? 'disabled' : ''}>${SYM.erfinden}</button>
        <button class="symbolknopf" title="${t.gekocht ? 'Nicht gekocht' : 'Gekocht'}" aria-label="Gekocht" data-gekocht="${t.id}" data-wert="${!t.gekocht}">${SYM.haken}</button>
        ${r ? `<button class="symbolknopf" title="Rezept zeigen" aria-label="Rezept zeigen" data-auf="${t.id}">${SYM.auf}</button>` : ''}
      </div>
      ${wunschZeile(t.id)}
      ${zustand.offen.has(t.id) ? details(r) : ''}
    </article>`;
  }).join('')}</div>`;
}

async function tauschen(id) {
  zustand.arbeitet.add(id); zeige();
  try {
    zustand.plan = await ruf(`/api/plan/tag/${id}/tauschen`, 'POST', { woche: zustand.plan.woche });
    melden('Ausgetauscht.');
  } catch (f) {
    melden(/kein anderes/.test(f.message) ? 'Im Pool ist nichts mehr übrig. Leg ein neues Rezept an.' : 'Tauschen ging nicht: ' + f.message);
    if (/kein anderes/.test(f.message)) zustand.wunschFuer = id;
  } finally { zustand.arbeitet.delete(id); zeige(); }
}

async function erfinden(id, wunsch) {
  zustand.wunschFuer = null; zustand.arbeitet.add(id); zeige();
  try {
    const raus = await ruf('/api/rezepte/erfinden', 'POST', { wunsch, tag_id: id, woche: zustand.plan.woche });
    if (raus.plan) zustand.plan = raus.plan;
    zustand.rezepte = null;
    melden(`Neu im Plan: ${raus.rezept.titel}`);
  } catch (f) { melden('Das neue Rezept ging nicht: ' + f.message); }
  finally { zustand.arbeitet.delete(id); zeige(); }
}

async function gekocht(id, wert) {
  zustand.plan = await ruf(`/api/plan/tag/${id}/gekocht`, 'POST', { gekocht: wert, woche: zustand.plan.woche }).catch((f) => (melden(f.message), zustand.plan));
  zeige();
}

// -------------------------------------------------------------- Rezepte --

async function ladeRezepte() { if (!zustand.rezepte) zustand.rezepte = await ruf('/api/rezepte').catch(() => []); }

const GRUPPEN = ['Suppen', 'Eintöpfe', 'Nudeln', 'Aufläufe und Gratins', 'Pfannengerichte', 'Braten und Schmorgerichte',
  'Kurzgebratenes', 'Currys', 'Wok und Asianudeln', 'Reis und Getreide', 'Kartoffelgerichte', 'Gemüsegerichte',
  'Fisch und Meeresfrüchte', 'Salate und Bowls', 'Pizza, Quiche und Flammkuchen', 'Brot und Snacks', 'Frühstück', 'Süßes'];

function passt(r) {
  if (zustand.kost && r.kost !== zustand.kost) return false;
  if (zustand.gruppe && (r.gruppe || 'Sonstiges') !== zustand.gruppe) return false;
  if (zustand.kueche && r.kueche !== zustand.kueche) return false;
  const q = zustand.suche.trim().toLowerCase();
  if (!q) return true;
  const heu = [r.titel, r.beschreibung, r.gruppe, r.kueche, ...(r.etiketten || []), ...(r.zutaten || []).map((z) => z.name)].join(' ').toLowerCase();
  return q.split(/\s+/).every((w) => heu.includes(w));
}

function tagAuswahl(rid) {
  const p = zustand.plan;
  if (!p?.tage?.length) return '';
  return `<select data-legen="${rid}" aria-label="Auf einen Tag legen"><option value="">Auf Tag legen …</option>
    ${p.tage.map((t) => { const d = datum(t.tag); return `<option value="${t.id}">${TAGNAME[d.getDay()]} ${d.getDate()}.</option>`; }).join('')}</select>`;
}

function rezeptKarte(r) {
  return `<article class="karte rezept">
    <div class="name">${esc(r.titel)}</div>${chips(r)}
    ${r.beschreibung ? `<div class="leise klein">${esc(r.beschreibung)}</div>` : ''}
    <div class="unten">${tagAuswahl(r.id)}<button class="symbolknopf" title="Rezept zeigen" aria-label="Rezept zeigen" data-rauf="${r.id}">${SYM.auf}</button></div>
    ${zustand.offen.has('r' + r.id) ? details(r) : ''}</article>`;
}

function zeigeRezepte() {
  const alle = zustand.rezepte || [];
  const liste = alle.filter(passt);
  const fokus = document.activeElement?.id === 'suchfeld';
  const kuechen = [...new Set(alle.map((r) => r.kueche).filter(Boolean))].sort((x, y) => x.localeCompare(y, 'de'));
  const gruppeVon = (r) => r.gruppe || 'Sonstiges';
  const uebersicht = !zustand.suche.trim() && !zustand.gruppe;
  let rumpf;
  if (!liste.length) {
    rumpf = `<div class="karte leer">Nichts gefunden.</div>`;
  } else if (uebersicht) {
    // Ohne Suche und ohne gewählte Gruppe: die Gruppen als Kacheln.
    const zahl = {};
    liste.forEach((r) => { zahl[gruppeVon(r)] = (zahl[gruppeVon(r)] || 0) + 1; });
    rumpf = `<div class="gruppen">${[...GRUPPEN, 'Sonstiges'].filter((g) => zahl[g]).map((g) => `<button class="karte gruppe" data-gruppe="${esc(g)}">
      <span class="gname">${esc(g)}</span><span class="leise klein">${zahl[g]} Rezepte</span>
      <span class="gbsp leise klein">${liste.filter((r) => gruppeVon(r) === g).slice(0, 3).map((r) => esc(r.titel)).join(' · ')}</span></button>`).join('')}</div>`;
  } else if (zustand.gruppe) {
    rumpf = `<div class="raster">${liste.map(rezeptKarte).join('')}</div>`;
  } else {
    rumpf = [...GRUPPEN, 'Sonstiges'].map((g) => {
      const teil = liste.filter((r) => gruppeVon(r) === g);
      return teil.length ? `<h3 class="ghead">${esc(g)} <span class="leise klein">${teil.length}</span></h3><div class="raster">${teil.map(rezeptKarte).join('')}</div>` : '';
    }).join('');
  }
  $('#inhalt').innerHTML = rezeptKopf() + `
    <div class="suche"><input id="suchfeld" class="feld" type="search" placeholder="Suchen nach Gericht, Zutat oder Stichwort" value="${esc(zustand.suche)}"></div>
    <div class="filter">${['', ...Object.keys(KOST)].map((k) => `<button data-kost="${k}" class="${zustand.kost === k ? 'an' : ''}">${k ? KOST[k] : 'Alle'}</button>`).join('')}
      <select id="kuecheWahl" class="wahl" aria-label="Küche"><option value="">Alle Küchen</option>
        ${kuechen.map((k) => `<option ${zustand.kueche === k ? 'selected' : ''}>${esc(k)}</option>`).join('')}</select>
      <span class="leise klein" style="align-self:center;margin-left:6px">${liste.length} von ${alle.length}</span></div>
    ${zustand.gruppe ? `<div class="gruppenkopf"><button class="knopf" data-gruppe="">‹ Alle Gruppen</button><h2>${esc(zustand.gruppe)}</h2></div>` : ''}
    ${rumpf}
    <section class="karte erfinden">
      <h2 style="margin:0">Nichts dabei?</h2>
      <p class="leise klein" style="margin:0">Beschreib, worauf du Lust hast. Das Rezept kommt in den Pool.</p>
      <form class="wunsch" id="neuesRezept"><input class="feld" name="wunsch" placeholder="z. B. etwas mit Kürbis, schnell, vegetarisch" value="${esc(zustand.suche)}" autocomplete="off">
        <button class="knopf haupt">${SYM.erfinden}Neues Rezept</button></form>
      <div id="erfindStand"></div>
    </section>`;
  if (fokus) { const f = $('#suchfeld'); f.focus(); f.setSelectionRange(f.value.length, f.value.length); }
}

// --------------------------------------------------------------- Planen --

async function zeigePlanen() {
  if (!zustand.regeln) zustand.regeln = await ruf('/api/regeln').catch(() => ({}));
  const rg = zustand.regeln || {};
  const tage = (rg.tage || WOCHENTAGE.join(',')).toLowerCase().split(',');
  const kost = (rg.nur_kost || '').split(',').filter(Boolean);
  const woche = montag(zustand.versatz);
  $('#inhalt').innerHTML = `<div class="ansicht"><button class="knopf" data-gehe="woche" style="margin-left:0">‹ Zurück zum Plan</button></div><section class="karte planen">
    <div><h2 style="margin:0 0 4px">Woche ab ${datum(woche).toLocaleDateString('de-DE')} planen</h2>
      <p class="leise klein" style="margin:0">Die Gerichte kommen aus dem Pool. Ein vorhandener Plan dieser Woche wird ersetzt.</p></div>
    <label class="ueber" for="personen">Personen</label>
    <input class="feld" id="personen" type="number" min="1" max="12" value="${Number(rg.personen) || 2}" style="max-width:120px">
    <label class="ueber">An diesen Tagen</label>
    <div class="wahl">${WOCHENTAGE.map((t) => `<label><input type="checkbox" data-ptag="${t}" ${tage.includes(t) ? 'checked' : ''}>${t[0].toUpperCase() + t.slice(1, 2)}</label>`).join('')}</div>
    <label class="ueber">Nur diese Kost (nichts gewählt heißt alles)</label>
    <div class="wahl">${Object.entries(KOST).map(([k, n]) => `<label><input type="checkbox" data-pkost="${k}" ${kost.includes(k) ? 'checked' : ''}>${n}</label>`).join('')}</div>
    <label class="ueber" for="wuensche">Wünsche</label>
    <textarea class="feld" id="wuensche" rows="3" placeholder="z. B. mehr Gemüse, Donnerstag Fisch, nichts Scharfes">${esc(rg.wuensche || '')}</textarea>
    <div style="display:flex;gap:10px;align-items:center"><button class="knopf haupt" id="planErzeugen">${SYM.erfinden}Plan erzeugen</button><span id="planStand"></span></div>
  </section>`;
}

async function planErzeugen(knopf) {
  knopf.disabled = true;
  $('#planStand').innerHTML = '<span class="denkt">Die Woche wird zusammengestellt …</span>';
  try {
    const raus = await ruf('/api/plan/erzeugen', 'POST', {
      woche: montag(zustand.versatz), personen: Number($('#personen').value) || 2, wuensche: $('#wuensche').value,
      tage: $$('[data-ptag]:checked').map((k) => k.dataset.ptag), nur_kost: $$('[data-pkost]:checked').map((k) => k.dataset.pkost),
    });
    zustand.plan = raus.plan; zustand.regeln = null;
    melden(raus.meldung || 'Plan steht.');
    wechsle('woche');
  } catch (f) { $('#planStand').textContent = 'Ging nicht: ' + f.message; knopf.disabled = false; }
}

// ----------------------------------------------------------------- Chat --

// Das Modell schreibt gern ein wenig Markdown: fett, Listen, Nummern.
function md(text) {
  return esc(text)
    .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')
    .replace(/^\s*[*-]\s+/gm, '• ')
    .replace(/^#{1,4}\s+(.+)$/gm, '<b>$1</b>');
}

function zeigeChat() {
  const v = zustand.chat;
  $('#inhalt').innerHTML = `<section class="chat">
    <div class="verlauf" id="verlauf">${v.length ? v.map((n) => `<div class="blase ${n.role === 'user' ? 'ich' : 'ki'}">${n.role === 'user' ? esc(n.content) : md(n.content)}${n.schritte?.length ? `<div class="taten">${n.schritte.map((s) => `<span>${SYM.haken}${esc(s)}</span>`).join('')}</div>` : ''}</div>`).join('')
      : '<div class="leer">Frag nach dem Plan, nach Rezepten oder Nährwerten. Der Chat kann auch Gerichte tauschen, neue Rezepte anlegen, die Woche planen und die Einkaufsliste ergänzen.</div>'}
      ${zustand.chatLaeuft ? '<div class="blase ki"><span class="denkt">Moment …</span></div>' : ''}</div>
    <div>
      <div class="vorschlaege">${['Was gibt es heute, und was muss ich vorbereiten?', 'Tausch morgen gegen etwas Vegetarisches', 'Ich habe Zucchini und Feta übrig, was kann ich kochen?', 'Plan die nächste Woche mit viel Gemüse', 'Wie viel Eiweiß hat Skyr?', 'Setz Kaffee auf die Einkaufsliste']
        .map((s) => `<button data-frage="${esc(s)}">${esc(s)}</button>`).join('')}
        ${v.length ? '<button data-neu>Neues Gespräch</button>' : ''}</div>
      <form class="eingabe" id="chatForm"><textarea class="feld" id="chatFeld" placeholder="Nachricht an den Kochassistenten" rows="1"></textarea>
        <button class="knopf haupt" ${zustand.chatLaeuft ? 'disabled' : ''} aria-label="Senden">${SYM.senden}</button></form>
    </div></section>`;
  const vl = $('#verlauf'); vl.scrollTop = vl.scrollHeight;
  if (!zustand.chatLaeuft) $('#chatFeld').focus();
}

async function fragen(text) {
  text = text.trim(); if (!text || zustand.chatLaeuft) return;
  zustand.chat.push({ role: 'user', content: text }); merken('foodr-chat', zustand.chat);
  zustand.chatLaeuft = true; zeige();
  try {
    const raus = await ruf('/api/chat', 'POST', { verlauf: zustand.chat.map(({ role, content }) => ({ role, content })) });
    zustand.chat.push({ role: 'assistant', content: raus.antwort, schritte: raus.schritte || [] });
    if (raus.geaendert) { zustand.rezepte = null; await ladePlan(); }
  } catch (f) { zustand.chat.push({ role: 'assistant', content: 'Das ging gerade nicht: ' + f.message }); }
  zustand.chatLaeuft = false; merken('foodr-chat', zustand.chat); zeige();
}

// -------------------------------------------------------------- Einkauf --

async function zeigeEinkauf() {
  const p = zustand.plan;
  if (!p?.id) { $('#inhalt').innerHTML = '<div class="karte leer">Ohne Plan gibt es keine Einkaufsliste.</div>'; return; }
  const posten = await ruf(`/api/plan/${p.id}/einkauf`).catch(() => []);
  const gruppen = {};
  for (const x of posten) (gruppen[x.kategorie || 'Sonstiges'] ||= []).push(x);
  const offen = posten.filter((x) => !x.abgehakt).length;
  $('#inhalt').innerHTML = `<p class="leise klein" style="margin:0 0 12px">${offen} von ${posten.length} noch offen</p>
    ${Object.entries(gruppen).map(([k, l]) => `<section class="gruppe"><h2>${esc(k)}</h2><ul class="karte posten">
      ${l.map((x) => `<li><input type="checkbox" data-posten="${x.id}" ${x.abgehakt ? 'checked' : ''} id="p${x.id}">
        <label for="p${x.id}" class="${x.abgehakt ? 'weg' : ''}">${esc(x.name)}</label><span class="menge">${esc(menge(x))}</span></li>`).join('')}
    </ul></section>`).join('') || '<div class="karte leer">Die Liste ist leer.</div>'}`;
}

// --------------------------------------------------------- Lebensmittel --

const lm = { q: '', quelle: '', treffer: [], gesamt: 0, mehr: false, offen: null, details: {}, laedt: false };
const zahl = (x, n = 1) => (x == null ? 'k. A.' : Number(x).toLocaleString('de-DE', { maximumFractionDigits: n }));

async function lmSuchen(anhaengen = false) {
  const q = lm.q.trim();
  if (q.length < 2) { lm.treffer = []; lm.gesamt = 0; lm.mehr = false; return zeigeLebensmittel(); }
  lm.laedt = true; zeigeLebensmittel();
  const p = new URLSearchParams({ q, grenze: '30', ab: String(anhaengen ? lm.treffer.length : 0) });
  if (lm.quelle) p.set('quelle', lm.quelle);
  try {
    const d = await ruf('/api/lebensmittel?' + p);
    if (q !== lm.q.trim()) return;
    lm.treffer = anhaengen ? [...lm.treffer, ...(d.treffer || [])] : (d.treffer || []);
    lm.gesamt = d.gesamt || 0; lm.mehr = !!d.mehr;
  } catch (f) { melden('Suche ging nicht: ' + f.message); }
  lm.laedt = false; zeigeLebensmittel();
}

function lmDetails(id) {
  const d = lm.details[id];
  if (!d) return '<div class="naehr"><span class="denkt">lädt …</span></div>';
  return `<div class="naehr">${(d.gruppen || []).filter((g) => g.stoffe?.some((s) => s.wert != null)).map((g) => `<div><h2>${esc(g.name)}</h2><table>
    ${g.stoffe.filter((s) => s.wert != null).map((s) => `<tr><td>${esc(s.name)}</td><td class="z">${zahl(s.wert, 2)} ${esc(s.einheit)}</td></tr>`).join('')}</table></div>`).join('')}
    <p class="leise klein" style="grid-column:1/-1;margin:0">je 100 g · ${esc(d.quelle_name || d.quelle)}${d.lizenz ? ' · ' + esc(d.lizenz) : ''}</p></div>`;
}

function zeigeLebensmittel() {
  const fokus = document.activeElement?.id === 'lmFeld';
  $('#inhalt').innerHTML = rezeptKopf() + `
    <div class="suche"><input id="lmFeld" class="feld" type="search" placeholder="Lebensmittel, Marke oder Barcode suchen (BLS und Open Food Facts)" value="${esc(lm.q)}"></div>
    <div class="filter">${[['', 'Alle'], ['bls', 'BLS 4.0'], ['off', 'Markenprodukte']].map(([k, n]) => `<button data-lmquelle="${k}" class="${lm.quelle === k ? 'an' : ''}">${n}</button>`).join('')}
      <span class="leise klein" style="align-self:center;margin-left:6px">${lm.q.trim().length < 2 ? 'rund 3,4 Millionen Einträge' : lm.laedt && !lm.treffer.length ? '' : `${zahl(lm.gesamt, 0)} Treffer`}</span></div>
    ${lm.laedt && !lm.treffer.length ? '<span class="denkt">sucht …</span>' : lm.treffer.length ? `<ul class="karte lm">${lm.treffer.map((x) => { const k = x.kern || {}; return `<li>
      <button class="lm-zeile" data-lm="${esc(x.id)}">
        ${x.bild ? `<img class="lm-bild" src="${esc(mitBasis(x.bild))}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.removeAttribute('src')">` : `<span class="lm-bild">${x.quelle === 'bls' ? 'BLS' : ''}</span>`}
        <span><span class="lm-name">${esc(x.name)}</span>${x.marke ? ` <span class="leise klein">${esc(x.marke)}</span>` : ''}
          <span class="makros"><span>Eiweiß <b>${zahl(k.PROT625)} g</b></span><span>Fett <b>${zahl(k.FAT)} g</b></span><span>KH <b>${zahl(k.CHO)} g</b></span>${k.SUGAR != null ? `<span>Zucker <b>${zahl(k.SUGAR)} g</b></span>` : ''}</span></span>
        <span class="lm-kcal">${zahl(k.ENERCC, 0)}<small>kcal</small></span></button>
      ${lm.offen === x.id ? lmDetails(x.id) : ''}</li>`; }).join('')}</ul>
      ${lm.mehr ? `<div style="margin-top:12px"><button class="knopf" data-lmmehr ${lm.laedt ? 'disabled' : ''}>Weitere laden</button></div>` : ''}`
    : lm.q.trim().length >= 2 ? '<div class="karte leer">Nichts gefunden.</div>' : ''}`;
  if (fokus) { const f = $('#lmFeld'); f.focus(); f.setSelectionRange(f.value.length, f.value.length); }
}

// ------------------------------------------------------------ Kalender --

const MONATE = ['Januar', 'Februar', 'März', 'April', 'Mai', 'Juni', 'Juli', 'August', 'September', 'Oktober', 'November', 'Dezember'];
const iso = (d) => { const x = new Date(d); x.setHours(12, 0, 0, 0); return x.toISOString().slice(0, 10); };

function monatsRaster() {
  const erster = new Date(); erster.setHours(12, 0, 0, 0); erster.setDate(1); erster.setMonth(erster.getMonth() + zustand.monat);
  const start = new Date(erster); start.setDate(1 - ((erster.getDay() + 6) % 7));
  const letzter = new Date(erster.getFullYear(), erster.getMonth() + 1, 0, 12);
  const ende = new Date(letzter); ende.setDate(letzter.getDate() + (6 - ((letzter.getDay() + 6) % 7)));
  const tage = []; for (let d = new Date(start); d <= ende; d.setDate(d.getDate() + 1)) tage.push(new Date(d));
  return { erster, tage, von: iso(start), bis: iso(ende) };
}

async function ladeKalender() {
  const m = monatsRaster();
  const tage = await ruf(`/api/kalender?von=${m.von}&bis=${m.bis}`).catch(() => []);
  zustand.kal = { schluessel: m.von, nachTag: Object.fromEntries((tage || []).map((t) => [t.tag, t])) };
}

function zeigeKalender() {
  const m = monatsRaster(); const heute = heuteIso();
  const nach = zustand.kal?.nachTag || {};
  const wahl = zustand.kalTag || heute;
  let html = planKopf() + `<section class="karte kal">
    <div class="kal-raster">${['Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa', 'So'].map((w) => `<div class="kal-wt">${w}</div>`).join('')}
    ${m.tage.map((d) => {
      const k = iso(d); const t = nach[k]; const r = t?.rezept;
      const kl = ['kal-tag', d.getMonth() !== m.erster.getMonth() ? 'fremd' : '', k === heute ? 'jetzt' : '', k === wahl ? 'gewaehlt' : '',
        t?.gekocht ? 'gekocht' : '', r ? '' : 'leer-tag'].filter(Boolean).join(' ');
      return `<button class="${kl}" data-kaltag="${k}" aria-label="${d.getDate()}. ${MONATE[d.getMonth()]}${r ? ': ' + esc(r.titel) : ''}">
        <span class="zahl">${d.getDate()}</span>${r ? `<span class="punkt ${esc(r.kost)}"></span><span class="gericht">${esc(r.titel)}</span>` : ''}</button>`;
    }).join('')}</div>
    <div class="kal-legende"><span><i class="punkt vegetarisch"></i>vegetarisch/vegan</span><span><i class="punkt fisch"></i>Fisch</span><span><i class="punkt fleisch"></i>Fleisch</span></div>
  </section>`;
  const t = nach[wahl]; const d = datum(wahl);
  html += `<section class="karte kal-auswahl">
    <div class="tagname">${wahl === heute ? 'Heute, ' : ''}${TAGNAME[d.getDay()]}, ${d.getDate()}. ${MONATE[d.getMonth()]}</div>
    ${t?.rezept ? `<p class="titel">${esc(t.rezept.titel)}</p>${chips(t.rezept)}
      ${t.hinweis ? `<p class="leise klein" style="margin:0">${esc(t.hinweis)}</p>` : ''}
      <div class="aktionen" style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="knopf ${t.gekocht ? 'gut' : ''}" data-kalgekocht="${t.id}" data-planwoche="${t.woche}" data-wert="${!t.gekocht}">${SYM.haken}${t.gekocht ? 'Gekocht' : 'Als gekocht markieren'}</button>
        <button class="knopf" data-kalauf="${t.id}">${SYM.auf}${zustand.offen.has('k' + t.id) ? 'Rezept zuklappen' : 'Rezept'}</button>
      </div>
      ${zustand.offen.has('k' + t.id) ? details(t.rezept) : ''}`
    : `<p class="leise" style="margin:0">Für diesen Tag ist nichts geplant.</p>`}
  </section>`;
  $('#inhalt').innerHTML = html;
}

// ------------------------------------------------------------- Rahmen --

async function zeige() {
  if (zustand.reiter === 'woche') zeigeWoche();
  else if (zustand.reiter === 'kalender') { if (!zustand.kal || zustand.kal.schluessel !== monatsRaster().von) await ladeKalender(); zeigeKalender(); }
  else if (zustand.reiter === 'rezepte') { await ladeRezepte(); zeigeRezepte(); }
  else if (zustand.reiter === 'planen') await zeigePlanen();
  else if (zustand.reiter === 'chat') zeigeChat();
  else if (zustand.reiter === 'einkauf') await zeigeEinkauf();
  else if (zustand.reiter === 'lebensmittel') zeigeLebensmittel();
}

function wechsle(r) {
  zustand.reiter = r;
  $$('.reiter [data-tab]').forEach((b) => b.classList.toggle('an', b.dataset.tab === TAB[r]));
  wochenNameSetzen();
  try { localStorage.setItem('foodr-kueche-reiter', r); } catch { /* egal */ }
  zeige();
}

document.addEventListener('click', async (e) => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.reiter) return wechsle(b.dataset.reiter);
  if (b.dataset.gehe) return wechsle(b.dataset.gehe);
  if (b.dataset.wochenschritt !== undefined) {
    const n = Number(b.dataset.wochenschritt);
    if (zustand.reiter === 'kalender') {
      zustand.monat = n === 0 ? 0 : zustand.monat + n; if (n === 0) zustand.kalTag = heuteIso();
      wochenNameSetzen(); await ladeKalender(); return zeigeKalender();
    }
    zustand.versatz = n === 0 ? 0 : zustand.versatz + 7 * n;
    wochenNameSetzen(); await ladePlan(); return zeige();
  }
  if (b.dataset.springe) { const el = document.getElementById('tag-' + b.dataset.springe); if (el) { zustand.offen.add(Number(b.dataset.springe)); zeige(); document.getElementById('tag-' + b.dataset.springe)?.scrollIntoView({ behavior: 'smooth', block: 'center' }); } return; }
  if (b.dataset.monat !== undefined) {
    const n = Number(b.dataset.monat); zustand.monat = n === 0 ? 0 : zustand.monat + n;
    if (n === 0) zustand.kalTag = heuteIso();
    await ladeKalender(); return zeigeKalender();
  }
  if (b.dataset.kaltag) { zustand.kalTag = b.dataset.kaltag; return zeigeKalender(); }
  if (b.dataset.kalauf) { const id = 'k' + b.dataset.kalauf; zustand.offen.has(id) ? zustand.offen.delete(id) : zustand.offen.add(id); return zeigeKalender(); }
  if (b.dataset.kalgekocht) {
    await ruf(`/api/plan/tag/${b.dataset.kalgekocht}/gekocht`, 'POST', { gekocht: b.dataset.wert === 'true', woche: b.dataset.planwoche }).catch((f) => melden(f.message));
    await ladePlan(); await ladeKalender(); return zeigeKalender();
  }
  if (b.dataset.tauschen) return tauschen(Number(b.dataset.tauschen));
  if (b.dataset.erfinden) { const id = Number(b.dataset.erfinden); zustand.wunschFuer = zustand.wunschFuer === id ? null : id; zeige(); $(`[data-wunsch="${id}"] input`)?.focus(); return; }
  if (b.dataset.gekocht) return gekocht(Number(b.dataset.gekocht), b.dataset.wert === 'true');
  if (b.dataset.auf) { const id = Number(b.dataset.auf); zustand.offen.has(id) ? zustand.offen.delete(id) : zustand.offen.add(id); return zeige(); }
  if (b.dataset.rauf) { const id = 'r' + b.dataset.rauf; zustand.offen.has(id) ? zustand.offen.delete(id) : zustand.offen.add(id); return zeige(); }
  if (b.dataset.lmquelle !== undefined) { lm.quelle = b.dataset.lmquelle; return lmSuchen(); }
  if (b.dataset.lmmehr !== undefined) return lmSuchen(true);
  if (b.dataset.lm) {
    const id = b.dataset.lm; lm.offen = lm.offen === id ? null : id; zeigeLebensmittel();
    if (lm.offen && !lm.details[id]) { lm.details[id] = await ruf('/api/lebensmittel/' + encodeURIComponent(id)).catch(() => ({ gruppen: [] })); if (lm.offen === id) zeigeLebensmittel(); }
    return;
  }
  if (b.dataset.kost !== undefined) { zustand.kost = b.dataset.kost; return zeigeRezepte(); }
  if (b.dataset.gruppe !== undefined) { zustand.gruppe = b.dataset.gruppe; zeigeRezepte(); return window.scrollTo({ top: 0 }); }
  if (b.id === 'planErzeugen') return planErzeugen(b);
  if (b.dataset.frage) return fragen(b.dataset.frage);
  if (b.dataset.neu !== undefined) { zustand.chat = []; merken('foodr-chat', []); return zeige(); }
});

document.addEventListener('submit', async (e) => {
  e.preventDefault();
  const f = e.target;
  if (f.dataset.wunsch) return erfinden(Number(f.dataset.wunsch), f.wunsch.value);
  if (f.id === 'chatForm') { const t = $('#chatFeld').value; return fragen(t); }
  if (f.id === 'neuesRezept') {
    const knopf = $('button', f); knopf.disabled = true;
    $('#erfindStand').innerHTML = '<span class="denkt">Rezept wird geschrieben …</span>';
    try {
      const raus = await ruf('/api/rezepte/erfinden', 'POST', { wunsch: f.wunsch.value });
      zustand.rezepte = null; zustand.suche = ''; await ladeRezepte();
      zustand.offen.add('r' + raus.rezept.id);
      melden(`Neu im Pool: ${raus.rezept.titel}`);
      zeigeRezepte();
    } catch (x) { $('#erfindStand').textContent = 'Ging nicht: ' + x.message; knopf.disabled = false; }
  }
});

document.addEventListener('input', (e) => {
  if (e.target.id === 'suchfeld') { zustand.suche = e.target.value; zeigeRezepte(); }
  if (e.target.id === 'lmFeld') { lm.q = e.target.value; clearTimeout(lm.t); lm.t = setTimeout(() => lmSuchen(), 300); }
});

document.addEventListener('keydown', (e) => {
  if (e.target.id === 'chatFeld' && e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); fragen(e.target.value); }
});

document.addEventListener('change', async (e) => {
  const s = e.target;
  if (s.id === 'kuecheWahl') { zustand.kueche = s.value; return zeigeRezepte(); }
  if (s.dataset.legen && s.value) {
    zustand.plan = await ruf(`/api/plan/tag/${s.value}`, 'PUT', { rezept_id: Number(s.dataset.legen), hinweis: '', woche: zustand.plan.woche })
      .catch((f) => (melden(f.message), zustand.plan));
    melden('Liegt im Plan.'); zeigeRezepte();
  }
  if (s.dataset.posten) {
    await ruf(`/api/einkauf/${s.dataset.posten}`, 'PATCH', { abgehakt: s.checked }).catch((f) => melden(f.message));
    s.nextElementSibling.classList.toggle('weg', s.checked);
  }
});

(async () => {
  try { zustand.reiter = localStorage.getItem('foodr-kueche-reiter') || 'woche'; } catch { /* egal */ }
  if (!TAB[zustand.reiter]) zustand.reiter = 'woche';
  $$('.reiter [data-tab]').forEach((b) => b.classList.toggle('an', b.dataset.tab === TAB[zustand.reiter]));
  wochenNameSetzen();
  await ladePlan();
  zeige();
  // Was andere (Handy, Rechner) am Plan ändern, kommt ohne Neuladen an.
  setInterval(async () => {
    if (document.hidden || zustand.arbeitet.size || zustand.reiter !== 'woche') return;
    await ladePlan(); zeigeWoche();
  }, 60000);
})();
</script>
